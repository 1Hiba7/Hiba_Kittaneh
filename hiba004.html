<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة المعرفة | هبة كتانة</title>
  <link rel="icon" type="image/png" href="4.png">
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            box-sizing: border-box;
            font-family: 'Cairo', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            overflow-x: hidden;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        .app-wrapper {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 20px;
            flex: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .login-logo {
            font-size: 3.5em;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-size: 2em;
            font-weight: 900;
            color: white;
            margin-bottom: 5px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1em;
        }

        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border-color: white;
        }

        .lang-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-container {
            display: flex;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: none;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border-radius: 10px;
            margin: 0 5px;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            padding: 30px 40px 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        [dir="rtl"] .input-group {
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
            color: #667eea;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 15px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        [dir="rtl"] .input-group input,
        [dir="rtl"] .input-group select {
            padding: 15px 20px 15px 50px;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: white;
            background: white;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.2);
        }

        .hero-selection {
            margin: 20px 0;
        }

        .hero-selection > label {
            display: block;
            margin-bottom: 15px;
            color: white;
            font-weight: 700;
            font-size: 1em;
        }

        .hero-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-option {
            position: relative;
            cursor: pointer;
        }

        .hero-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .hero-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            font-size: 2.2em;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .hero-option:hover .hero-emoji {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .hero-option input[type="radio"]:checked + .hero-emoji {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 1); }
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.4);
            margin-top: 15px;
        }

        .auth-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(251, 191, 36, 0.6);
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .dashboard-screen {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2.5em;
        }

        .logo-text {
            font-size: 1.8em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .user-info {
            text-align: right;
        }

        [dir="ltr"] .user-info {
            text-align: left;
        }

        .username {
            font-weight: 700;
            font-size: 1.2em;
            color: #333;
        }

        .grade-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 5px;
        }

        .score-display {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.3em;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1em;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .welcome-title {
            font-size: 2.5em;
            font-weight: 900;
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.2em;
            color: #666;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--subject-color);
        }

        .subject-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .subject-icon {
            font-size: 3.5em;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .subject-card:hover .subject-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .subject-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .progress-info {
            margin: 15px 0;
        }

        .progress-bar-wrapper {
            background: #e0e0e0;
            border-radius: 15px;
            height: 12px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--subject-color);
            border-radius: 15px;
            transition: width 0.6s ease;
        }

        .start-quiz-btn {
            background: linear-gradient(135deg, var(--subject-color), var(--subject-color-light));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
        }

        .start-quiz-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .quiz-screen {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .quiz-title {
            font-size: 2em;
            font-weight: 900;
            color: #333;
        }

        .quiz-progress {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-family: inherit;
            color: #333;
        }

        [dir="ltr"] .option-btn {
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(-5px);
        }

        [dir="ltr"] .option-btn:hover:not(:disabled) {
            transform: translateX(5px);
        }

        .option-btn.correct {
            border-color: #10b981;
            background: #d1fae5;
        }

        .option-btn.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .quiz-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .quiz-btn {
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        .back-btn:hover {
            background: #4b5563;
        }

        .quiz-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-screen {
            display: none;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            flex: 1;
        }

        .results-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .results-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 2.5em;
            font-weight: 900;
            color: #333;
            margin-bottom: 15px;
        }

        .results-score {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 15px 35px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
        }

        .retry-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
        }

        .dashboard-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .dashboard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(16, 185, 129, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            font-size: 1.1em;
            animation: slideInToast 0.5s ease-out;
            z-index: 1000;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.95);
        }

        @keyframes slideInToast {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        [dir="rtl"] .toast {
            right: auto;
            left: 30px;
        }

        [dir="rtl"] @keyframes slideInToast {
            from { transform: translateX(-400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .app-footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding: 16px 24px;
            text-align: center;
            color: #fbbf24;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: auto;
        }

        .return-to-encyclopedia {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 12px 28px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Cairo', sans-serif;
            margin: 20px auto;
            width: fit-content;
        }

        .return-to-encyclopedia:hover {
            background: #1e90ff;
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.4);
            color: white;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .return-to-encyclopedia span {
                display: none;
            }
            .return-to-encyclopedia {
                padding: 10px 18px;
                border-radius: 40px;
            }
            .return-to-encyclopedia::before {
                content: "🏠";
                font-size: 1.2rem;
            }
            .return-to-encyclopedia .icon-text {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 25px 30px 35px;
            }
            .dashboard-header {
                flex-direction: column;
                text-align: center;
            }
            .subjects-grid {
                grid-template-columns: 1fr;
            }
            .quiz-container {
                padding: 25px;
            }
            .results-container {
                padding: 30px;
            }
        }
    </style>

 <body class="h-full">
  <div class="app-wrapper"><!-- Login Screen -->
   <div class="login-screen" id="loginScreen">
    <div class="login-card">
     <div class="login-header">
      <div class="login-logo">
       🎓
      </div>
      <h1 class="login-title" id="mainTitle">رحلة المعرفة</h1>
      <p class="login-subtitle" id="mainSubtitle">ابدأ رحلة التعلم</p>
     </div>
     <div class="language-switcher"><button type="button" class="lang-btn" id="langEnBtn">English</button> <button type="button" class="lang-btn active" id="langArBtn">العربية</button>
     </div>
     <div class="tab-container"><button type="button" class="tab-btn active" id="loginTab">تسجيل دخول</button> <button type="button" class="tab-btn" id="signupTab">إنشاء حساب</button>
     </div>
     <div class="form-container"><!-- Login Form -->
      <div class="tab-content active" id="loginContent">

                {q: {ar: 'ما لغة برمجة المواقع الديناميكية؟', en: 'Dynamic website programming language?'}, o: [{ar: 'HTML', en: 'HTML'}, {ar: 'CSS', en: 'CSS'}, {ar: 'JavaScript', en: 'JavaScript'}, {ar: 'XML', en: 'XML'}], a: 2}
            ],

                {q: {ar: 'ما معنى Algorithm؟', en: 'What is Algorithm?'}, o: [{ar: 'خوارزمية - خطوات حل مشكلة', en: 'Algorithm - Problem solving steps'}, {ar: 'لغة برمجة', en: 'Programming Language'}, {ar: 'نظام تشغيل', en: 'Operating System'}, {ar: 'برنامج حماية', en: 'Security Software'}], a: 0},
                {q: {ar: 'ما هو Blockchain؟', en: 'What is Blockchain?'}, o: [{ar: 'لعبة', en: 'Game'}, {ar: 'تقنية سلسلة الكتل', en: 'Block Chain Technology'}, {ar: 'متصفح', en: 'Browser'}, {ar: 'نظام تشغيل', en: 'Operating System'}], a: 1}
            ]
        };

        const subjects = [
            {id: 'math', nameAr: 'الرياضيات', nameEn: 'Mathematics', icon: '🔢', color: '#3b82f6', colorLight: '#60a5fa'},
            {id: 'science', nameAr: 'العلوم', nameEn: 'Science', icon: '🔬', color: '#10b981', colorLight: '#34d399'},
            {id: 'arabic', nameAr: 'اللغة العربية', nameEn: 'Arabic', icon: '📖', color: '#f59e0b', colorLight: '#fbbf24'},
            {id: 'english', nameAr: 'اللغة الانجليزية', nameEn: 'English', icon: '🌐', color: '#ef4444', colorLight: '#f87171'},
            {id: 'history', nameAr: 'التاريخ', nameEn: 'History', icon: '📜', color: '#8b5cf6', colorLight: '#a78bfa'},
            {id: 'geography', nameAr: 'الجغرافيا', nameEn: 'Geography', icon: '🌍', color: '#06b6d4', colorLight: '#22d3ee'},
            {id: 'islamic', nameAr: 'التربية الاسلامية', nameEn: 'Islamic Studies', icon: '🕌', color: '#14b8a6', colorLight: '#2dd4bf'},
            {id: 'computer', nameAr: 'الحاسوب', nameEn: 'Computer', icon: '💻', color: '#6366f1', colorLight: '#818cf8'}
        ];

        let users = JSON.parse(localStorage.getItem('knowledgeQuestUsers') || '[]');
        let currentUser = null;
        let currentQuiz = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let quizScore = 0;

        document.addEventListener('DOMContentLoaded', () => {
            initializeEventListeners();
            applyLanguageTexts();
            checkAutoLogin();
        });

        function initializeEventListeners() {
            document.getElementById('langArBtn').addEventListener('click', () => switchLanguage('ar'));
            document.getElementById('langEnBtn').addEventListener('click', () => switchLanguage('en'));
            document.getElementById('loginTab').addEventListener('click', () => switchTab('login'));
            document.getElementById('signupTab').addEventListener('click', () => switchTab('signup'));
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('signupForm').addEventListener('submit', handleSignup);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('nextQuestionBtn').addEventListener('click', handleNextQuestion);
            document.getElementById('backToSubjectsBtn').addEventListener('click', showDashboard);
            document.getElementById('retryBtn').addEventListener('click', retryQuiz);
            document.getElementById('backToDashboardBtn').addEventListener('click', showDashboard);
        }

        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginContent = document.getElementById('loginContent');
            const signupContent = document.getElementById('signupContent');
            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginContent.classList.add('active');
                signupContent.classList.remove('active');
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupContent.classList.add('active');
                loginContent.classList.remove('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const userExists = users.find(u => u.username === username);
            if (!userExists) {
                showToast(currentLang === 'ar' ? 'اسم المستخدم غير موجود' : 'Username does not exist', true);
                return;
            }
            const user = users.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                showToast(currentLang === 'ar' ? 'تم تسجيل الدخول بنجاح!' : 'Login successful!', false);
                setTimeout(() => showDashboard(), 500);
            } else {
                showToast(currentLang === 'ar' ? 'كلمة المرور غير صحيحة' : 'Incorrect password', true);
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const grade = document.getElementById('gradeSelect').value;
            const hero = document.querySelector('input[name="hero"]:checked').value;
            if (users.find(u => u.username === username)) {
                showToast(currentLang === 'ar' ? 'اسم المستخدم موجود بالفعل' : 'Username already exists', true);
                return;
            }
            const newUser = {
                username,
                password,
                grade: parseInt(grade),
                hero,
                score: 0,
                progress: {},
                testsCompleted: 0,
                badges: []
            };
            users.push(newUser);
            localStorage.setItem('knowledgeQuestUsers', JSON.stringify(users));
            currentUser = newUser;
            localStorage.setItem('currentUser', JSON.stringify(newUser));
            showToast(currentLang === 'ar' ? 'تم انشاء الحساب بنجاح!' : 'Account created successfully!', false);
            setTimeout(() => showDashboard(), 500);
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginForm').reset();
            showToast(currentLang === 'ar' ? 'تم تسجيل الخروج' : 'Logged out', false);
        }

        function checkAutoLogin() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            updateDashboardUI();
            renderSubjects();
        }

        function updateDashboardUI() {
            document.getElementById('displayUsername').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.hero;
            document.getElementById('displayGrade').textContent = currentLang === 'ar' 
                ? `${translations[currentLang].gradeText} ${currentUser.grade}` 
                : `Grade ${currentUser.grade}`;
            document.getElementById('scoreDisplay').textContent = currentLang === 'ar'
                ? `${currentUser.score} ${translations[currentLang].scoreText}`
                : `${currentUser.score} ${translations[currentLang].scoreText}`;
        }

        function renderSubjects() {
            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = subjects.map(subject => {
                const progress = currentUser.progress[subject.id] || 0;
                const subjectName = currentLang === 'ar' ? subject.nameAr : subject.nameEn;
                return `
                    <div class="subject-card" style="--subject-color: ${subject.color}; --subject-color-light: ${subject.colorLight}">
                        <div class="subject-icon">${subject.icon}</div>
                        <div class="subject-name">${subjectName}</div>
                        <div class="progress-info">
                            <div>${translations[currentLang].progressText}: ${progress}%</div>
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar-fill" style="width: ${progress}%; background: ${subject.color}"></div>
                            </div>
                        </div>
                        <button class="start-quiz-btn" onclick="startQuiz('${subject.id}')" 
                                style="--subject-color: ${subject.color}; --subject-color-light: ${subject.colorLight}">
                            ${translations[currentLang].startQuiz}
                        </button>
                    </div>
                `;
            }).join('');
            grid.innerHTML += `
                <div class="subject-card" style="--subject-color: #fbbf24; --subject-color-light: #fcd34d; background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(252,211,77,0.1))">
                    <div class="subject-icon" style="font-size: 4em;">🏆</div>
                    <div class="subject-name">${translations[currentLang].leaderboardTitle}</div>
                    <div class="progress-info" style="margin: 15px 0;">
                        <div style="font-size: 0.9em; color: #ffffff;">
                            ${translations[currentLang].leaderboardDesc}
                        </div>
                    </div>
                    <button class="start-quiz-btn" onclick="showLeaderboard()" 
                            style="--subject-color: #fbbf24; --subject-color-light: #fcd34d;">
                        ${translations[currentLang].viewLeaders}
                    </button>
                </div>
            `;
        }

        function startQuiz(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            currentQuiz = subject;
            const questionsKey = `${subjectId}_${currentUser.grade}`;
            currentQuestions = questionsDB[questionsKey] || [];
            if (currentQuestions.length === 0) {
                showToast(currentLang === 'ar' ? 'لا توجد اسئلة لهذا المستوى' : 'No questions for this level', true);
                return;
            }
            currentQuestionIndex = 0;
            quizScore = 0;
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            updateQuizUI();
            loadQuestion();
        }

        function updateQuizUI() {
            const title = currentLang === 'ar' ? currentQuiz.nameAr : currentQuiz.nameEn;
            document.getElementById('quizTitle').textContent = `${currentQuiz.icon} ${title}`;
            document.getElementById('quizProgress').textContent = `${currentQuestionIndex + 1}/${currentQuestions.length}`;
        }

        function loadQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const questionText = currentLang === 'ar' ? question.q.ar : question.q.en;
            document.getElementById('questionText').textContent = questionText;
            const optionsHtml = question.o.map((option, index) => {
                const optionText = currentLang === 'ar' ? option.ar : option.en;
                return `<button class="option-btn" onclick="selectAnswer(${index})">${optionText}</button>`;
            }).join('');
            document.getElementById('optionsContainer').innerHTML = optionsHtml;
            document.getElementById('nextQuestionBtn').disabled = true;
        }

        function selectAnswer(selectedIndex) {
            const question = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === question.a) btn.classList.add('correct');
                if (index === selectedIndex && index !== question.a) btn.classList.add('incorrect');
            });
            if (selectedIndex === question.a) quizScore++;
            document.getElementById('nextQuestionBtn').disabled = false;
        }

        function handleNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                updateQuizUI();
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const percentage = Math.round((quizScore / currentQuestions.length) * 100);
            const pointsEarned = quizScore * 10;
            currentUser.score += pointsEarned;
            currentUser.progress[currentQuiz.id] = percentage;
            currentUser.testsCompleted++;
            checkBadges();
            const userIndex = users.findIndex(u => u.username === currentUser.username);
            users[userIndex] = currentUser;
            localStorage.setItem('knowledgeQuestUsers', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            showResults();
        }

        function checkBadges() {
            Object.values(currentUser.progress).forEach(prog => {
                if (prog >= 90 && !currentUser.badges.includes('genius')) {
                    currentUser.badges.push('genius');
                    showToast(currentLang === 'ar' ? '🏆 حصلت على شارة العبقري!' : '🏆 Genius Badge Earned!', false);
                }
            });
            if (currentUser.testsCompleted >= 50 && !currentUser.badges.includes('persistent')) {
                currentUser.badges.push('persistent');
                showToast(currentLang === 'ar' ? '🔥 حصلت على شارة المثابر!' : '🔥 Persistent Badge Earned!', false);
            }
            const topScore = Math.max(...users.map(u => u.score));
            if (currentUser.score === topScore && currentUser.score > 0 && !currentUser.badges.includes('star')) {
                currentUser.badges.push('star');
                showToast(currentLang === 'ar' ? '⭐ حصلت على شارة النجم!' : '⭐ Star Badge Earned!', false);
            }
        }

        function showResults() {
            const percentage = Math.round((quizScore / currentQuestions.length) * 100);
            const pointsEarned = quizScore * 10;
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            let icon = '🎯';
            let message = '';
            if (percentage >= 90) {
                icon = '🏆';
                message = currentLang === 'ar' ? 'ممتاز! اداء رائع!' : 'Excellent! Outstanding performance!';
            } else if (percentage >= 70) {
                icon = '🌟';
                message = currentLang === 'ar' ? 'جيد جداً! استمر!' : 'Very Good! Keep it up!';
            } else if (percentage >= 50) {
                icon = '👍';
                message = currentLang === 'ar' ? 'جيد! يمكنك التحسن' : 'Good! You can improve';
            } else {
                icon = '💪';
                message = currentLang === 'ar' ? 'حاول مرة اخرى!' : 'Try again!';
            }
            document.getElementById('resultsContainer').innerHTML = `
                <div class="results-icon" id="resultsIcon">${icon}</div>
                <h2 class="results-title" id="resultsTitle">${translations[currentLang].quizCompleted}</h2>
                <div class="results-score" id="resultsScore">${quizScore}/${currentQuestions.length}</div>
                <p class="results-message" id="resultsMessage">${message}<br>+${pointsEarned} ${translations[currentLang].scoreText}</p>
                <div class="results-actions">
                    <button class="result-btn retry-btn" id="retryBtn">${translations[currentLang].retryQuiz}</button>
                    <button class="result-btn dashboard-btn" id="backToDashboardBtn">${translations[currentLang].backToDashboard}</button>
                </div>
            `;
            document.getElementById('retryBtn').addEventListener('click', retryQuiz);
            document.getElementById('backToDashboardBtn').addEventListener('click', showDashboard);
        }

        function retryQuiz() {
            startQuiz(currentQuiz.id);
        }

        function showLeaderboard() {
            const sortedUsers = [...users].sort((a, b) => b.score - a.score).slice(0, 10);
            const leaderboardHTML = `
                <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 25px; padding: 40px; max-width: 700px; margin: 0 auto;">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="font-size: 4em; margin-bottom: 15px;">🏆</div>
                        <h2 style="font-size: 2.5em; font-weight: 900; color: #333; margin-bottom: 10px;">
                            ${translations[currentLang].leaderboardTitle}
                        </h2>
                        <p style="font-size: 1.1em; color: #666;">
                            ${translations[currentLang].leaderboardSubtitle}
                        </p>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        ${sortedUsers.map((user, index) => {
                            const isCurrentUser = user.username === currentUser.username;
                            const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                            const bgColor = isCurrentUser ? 'rgba(251, 191, 36, 0.2)' : 'rgba(255, 255, 255, 0.5)';
                            const borderColor = isCurrentUser ? '#fbbf24' : '#e0e0e0';
                            return `
                                <div style="background: ${bgColor}; border: 3px solid ${borderColor}; border-radius: 15px; padding: 20px; display: flex; align-items: center; gap: 20px; transition: all 0.3s ease;">
                                    <div style="font-size: 2em; min-width: 50px; text-align: center; font-weight: 700;">${medal}</div>
                                    <div style="font-size: 2.5em;">${user.hero}</div>
                                    <div style="flex: 1;">
                                        <div style="font-size: 1.3em; font-weight: 700; color: #333; margin-bottom: 5px;">${user.username} ${isCurrentUser ? '⭐' : ''}</div>
                                        <div style="font-size: 0.9em; color: #666;">${translations[currentLang].gradeText} ${user.grade} • ${user.testsCompleted} ${translations[currentLang].tests}</div>
                                    </div>
                                    <div style="font-size: 1.5em; font-weight: 700; color: #667eea;">${user.score} ${translations[currentLang].pts}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <button onclick="closeLeaderboard()" style="width: 100%; margin-top: 30px; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 15px; font-size: 1.2em; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.3s ease;">
                        ${translations[currentLang].backToDashboard}
                    </button>
                </div>
            `;
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = leaderboardHTML;
        }

        function closeLeaderboard() {
            showDashboard();
        }

        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

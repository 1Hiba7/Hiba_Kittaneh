<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة المعرفة | هبة كتانة</title>
  <link rel="icon" type="image/png" href="4.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            box-sizing: border-box;
            font-family: 'Cairo', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            overflow-x: hidden;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        .app-wrapper {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 20px;
            flex: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .login-logo {
            font-size: 3.5em;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-size: 2em;
            font-weight: 900;
            color: white;
            margin-bottom: 5px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1em;
        }

        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border-color: white;
        }

        .lang-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-container {
            display: flex;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: none;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border-radius: 10px;
            margin: 0 5px;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            padding: 30px 40px 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        [dir="rtl"] .input-group {
            text-align: right;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        [dir="rtl"] .input-group input,
        [dir="rtl"] .input-group select {
            padding: 15px 20px 15px 50px;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: white;
            background: white;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.2);
        }

        .hero-selection {
            margin: 20px 0;
        }

        .hero-selection > label {
            display: block;
            margin-bottom: 15px;
            color: white;
            font-weight: 700;
            font-size: 1em;
        }

        .hero-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-option {
            position: relative;
            cursor: pointer;
        }

        .hero-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .hero-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            font-size: 2.2em;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .hero-option:hover .hero-emoji {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .hero-option input[type="radio"]:checked + .hero-emoji {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 1); }
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.4);
            margin-top: 15px;
        }

        .auth-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(251, 191, 36, 0.6);
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .dashboard-screen {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2.5em;
        }

        .logo-text {
            font-size: 1.8em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .user-info {
            text-align: right;
        }

        [dir="ltr"] .user-info {
            text-align: left;
        }

        .username {
            font-weight: 700;
            font-size: 1.2em;
            color: #333;
        }

        .grade-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 5px;
        }

        .score-display {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.3em;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1em;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .welcome-title {
            font-size: 2.5em;
            font-weight: 900;
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.2em;
            color: #666;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--subject-color);
        }

        .subject-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .subject-icon {
            font-size: 3.5em;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .subject-card:hover .subject-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .subject-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .start-quiz-btn {
            background: linear-gradient(135deg, var(--subject-color), var(--subject-color-light));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
        }

        .quiz-screen {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .quiz-title {
            font-size: 2em;
            font-weight: 900;
            color: #333;
        }

        .quiz-progress {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-family: inherit;
            color: #333;
        }

        [dir="ltr"] .option-btn {
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(-5px);
        }

        [dir="ltr"] .option-btn:hover:not(:disabled) {
            transform: translateX(5px);
        }

        .option-btn.correct {
            border-color: #10b981;
            background: #d1fae5;
        }

        .option-btn.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .quiz-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .quiz-btn {
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        .back-btn:hover {
            background: #4b5563;
        }

        .quiz-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-screen {
            display: none;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            flex: 1;
        }

        .results-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .results-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 2.5em;
            font-weight: 900;
            color: #333;
            margin-bottom: 15px;
        }

        .results-score {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 15px 35px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
        }

        .retry-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
        }

        .dashboard-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .dashboard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(16, 185, 129, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            font-size: 1.1em;
            animation: slideInToast 0.5s ease-out;
            z-index: 1000;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.95);
        }

        @keyframes slideInToast {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        [dir="rtl"] .toast {
            right: auto;
            left: 30px;
        }

        [dir="rtl"] @keyframes slideInToast {
            from { transform: translateX(-400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .app-footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding: 16px 24px;
            text-align: center;
            color: #fbbf24;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: auto;
        }

        .return-to-encyclopedia {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 12px 28px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Cairo', sans-serif;
            margin: 20px auto;
            width: fit-content;
        }

        .return-to-encyclopedia:hover {
            background: #1e90ff;
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.4);
            color: white;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .return-to-encyclopedia span {
                display: none;
            }
            .return-to-encyclopedia {
                padding: 10px 18px;
                border-radius: 40px;
            }
            .return-to-encyclopedia::before {
                content: "🏠";
                font-size: 1.2rem;
            }
            .return-to-encyclopedia .icon-text {
                display: none;
            }
        }
  </style>
 </head>
 <body class="h-full">
  <div class="app-wrapper">
   
   <div class="login-screen" id="loginScreen">
    <div class="login-card">
     <div class="login-header">
      <div class="login-logo">🎓</div>
      <h1 class="login-title" id="mainTitle">رحلة المعرفة</h1>
      <p class="login-subtitle" id="mainSubtitle">ابدأ رحلة التعلم</p>
     </div>
     <div class="language-switcher">
      <button type="button" class="lang-btn" id="langEnBtn">English</button> 
      <button type="button" class="lang-btn active" id="langArBtn">العربية</button>
     </div>
     <div class="tab-container">
      <button type="button" class="tab-btn active" id="loginTab">تسجيل دخول</button> 
      <button type="button" class="tab-btn" id="signupTab">إنشاء حساب</button>
     </div>
     <div class="form-container">
      
      <div class="tab-content active" id="loginContent">
       <form id="loginForm">
        <div class="input-group">
         <label for="loginUsername" id="loginUsernameLabel">اسم المستخدم</label>
         <div class="input-wrapper">
          <input type="text" id="loginUsername" required> <span class="input-icon">👤</span>
         </div>
        </div>
        <div class="input-group">
         <label for="loginPassword" id="loginPasswordLabel">كلمة المرور</label>
         <div class="input-wrapper">
          <input type="password" id="loginPassword" required> <span class="input-icon">🔒</span>
         </div>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">استكمل المغامرة 🚀</button>
       </form>
      </div>
      
      <div class="tab-content" id="signupContent">
       <form id="signupForm">
        <div class="input-group">
         <label for="signupUsername" id="signupUsernameLabel">اسم المستخدم</label>
         <div class="input-wrapper">
          <input type="text" id="signupUsername" required> <span class="input-icon">👤</span>
         </div>
        </div>
        <div class="input-group">
         <label for="signupPassword" id="signupPasswordLabel">كلمة المرور</label>
         <div class="input-wrapper">
          <input type="password" id="signupPassword" required> <span class="input-icon">🔒</span>
         </div>
        </div>
        <div class="input-group">
         <label for="gradeSelect" id="gradeSelectLabel">اختر صفك الدراسي</label>
         <div class="input-wrapper">
          <select id="gradeSelect" required>
           <option value="">اختر الصف / Choose Grade</option>
           <option value="6">الصف السادس / 6th Grade</option>
           <option value="7">الصف السابع / 7th Grade</option>
           <option value="8">الصف الثامن / 8th Grade</option>

     <div class="user-section">

      <div class="user-info">
       <div class="username" id="displayUsername">طالب</div>

   <div class="quiz-screen" id="quizScreen">
    <div class="quiz-container">
     <div class="quiz-header">
      <h2 class="quiz-title" id="quizTitle">اختبار</h2>
      <div class="quiz-progress" id="quizProgress">1/5</div>

     <div class="question-card">

      <button class="quiz-btn back-btn" id="backToSubjectsBtn">العودة للمواد</button>

   <div class="results-screen" id="resultsScreen">
    <div class="results-container" id="resultsContainer">
     <div class="results-icon" id="resultsIcon">🏆</div>

      <button class="result-btn retry-btn" id="retryBtn">حاول مرة أخرى</button>

   <div class="footer-container">
    <footer class="app-footer">جميع الحقوق محفوظة لـ هبة كتانة / قلقيلية الشرعية / وزارة الأوقاف / فلسطين</footer>

     <span>🏠</span> <span class="icon-text">العودة للموسوعة الرئيسية</span>
    </a>
   </div>
  </div>

  <script>
    // 1. إعدادات سوبابيز الأساسية
    const SUPABASE_URL = "https://xjcsvvrzqjpkaxuwhebl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_C6QsfadUxnRFV0Nvuaj_Dg_0ttlkFAB";
    
    // تم تغيير اسم المتغير لـ supabaseClient لمنع الخطأ البرمجي والتعارض مع اسم المكتبة الافتراضي
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // نظام الترجمة واللغات المعدل والمكتمل الحقول
    const translations = {
        ar: {
            mainTitle: 'رحلة المعرفة', mainSubtitle: 'ابدأ رحلة التعلم', loginTab: 'تسجيل دخول', signupTab: 'إنشاء حساب',
            loginUsernameLabel: 'اسم المستخدم', loginPasswordLabel: 'كلمة المرور', loginBtn: 'استكمل المغامرة 🚀',
            signupUsernameLabel: 'اسم المستخدم', signupPasswordLabel: 'كلمة المرور', gradeSelectLabel: 'اختر صفك الدراسي',
            heroSelectLabel: 'اختر صورتك الرمزية', signupBtn: 'إنشاء حساب 🎯', dashboardTitle: 'رحلة المعرفة',
            welcomeTitle: 'مرحباً بعودتك!', welcomeSubtitle: 'اختر مادة لبدء التعلم', logoutBtn: 'تسجيل خروج',
            scoreText: 'نقطة', gradeText: 'الصف', backToSubjects: 'العودة للمواد', nextQuestion: 'السؤال التالي',
            quizCompleted: 'اكتمل الاختبار!', retryQuiz: 'حاول مرة أخرى', backToDashboard: 'العودة للوحة الرئيسية',
            startQuiz: 'ابدأ الاختبار', pts: 'نقاط'
        },
        en: {
            mainTitle: 'Knowledge Quest', mainSubtitle: 'Start Your Learning Journey', loginTab: 'Login', signupTab: 'Sign Up',
            loginUsernameLabel: 'Username', loginPasswordLabel: 'Password', loginBtn: 'Continue Adventure 🚀',
            signupUsernameLabel: 'Username', signupPasswordLabel: 'Password', gradeSelectLabel: 'Choose Your Grade',
            heroSelectLabel: 'Choose Your Avatar', signupBtn: 'Create Account 🎯', dashboardTitle: 'Knowledge Quest',
            welcomeTitle: 'Welcome Back!', welcomeSubtitle: 'Choose a subject to start learning', logoutBtn: 'Logout',
            scoreText: 'Points', gradeText: 'Grade', backToSubjects: 'Back to Subjects', nextQuestion: 'Next Question',
            quizCompleted: 'Quiz Completed!', retryQuiz: 'Try Again', backToDashboard: 'Back to Dashboard',
            startQuiz: 'Start Quiz', pts: 'Points'
        }
    };

    let currentLang = 'ar';
    let currentUser = null;
    let currentSubject = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let selectedOptionIndex = null;
    let scoreGained = 0;

    // بنك الأسئلة المبدئي
    const quizData = {
        math: [
            { q_ar: "ما ناتج 5 + 7؟", q_en: "What is 5 + 7?", options_ar: ["10", "12", "14", "15"], options_en: ["10", "12", "14", "15"], answer: 1 },
            { q_ar: "ما هو الجذر التربيعي للعدد 16؟", q_en: "What is the square root of 16?", options_ar: ["2", "4", "6", "8"], options_en: ["2", "4", "6", "8"], answer: 1 }
        ],
        science: [
            { q_ar: "ما هو رمز الماء الكيميائي؟", q_en: "What is the chemical symbol for water?", options_ar: ["CO2", "H2O", "O2", "NaCl"], options_en: ["CO2", "H2O", "O2", "NaCl"], answer: 1 },
            { q_ar: "أي كوكب يسمى الكوكب الأحمر؟", q_en: "Which planet is known as the Red Planet?", options_ar: ["الأرض", "المريخ", "المشتري", "زحل"], options_en: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 1 }
        ],
        technology: [
            { q_ar: "ماذا يعني اختصار CPU؟", q_en: "What does CPU stand for?", options_ar: ["وحدة المعالجة المركزية", "وحدة الطاقة", "الذاكرة العشوائية", "كرت الشاشة"], options_en: ["Central Processing Unit", "Control Power Unit", "Computer Personal Unit", "Core Processing Unit"], answer: 0 }
        ]
    };

    const subjects = [
        { id: 'math', nameAr: 'الرياضيات', nameEn: 'Mathematics', icon: '📐', color: '#667eea', colorLight: '#764ba2' },
        { id: 'science', nameAr: 'العلوم', nameEn: 'Science', icon: '🔬', color: '#10b981', colorLight: '#059669' },
        { id: 'technology', nameAr: 'التكنولوجيا', nameEn: 'Technology', icon: '💻', color: '#fbbf24', colorLight: '#f59e0b' }
    ];

    // تبديل لغات الواجهة بشكل فوري وتحديث النصوص
    document.getElementById('langArBtn').addEventListener('click', () => updateLanguage('ar'));
    document.getElementById('langEnBtn').addEventListener('click', () => updateLanguage('en'));

    function updateLanguage(lang) {
        currentLang = lang;
        document.getElementById('langArBtn').classList.toggle('active', lang === 'ar');
        document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
        
        // تغيير اتجاه الصفحة
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;

        // تحديث جميع النصوص بناء على اللغة المختارة
        document.getElementById('mainTitle').textContent = translations[lang].mainTitle;
        document.getElementById('mainSubtitle').textContent = translations[lang].mainSubtitle;
        document.getElementById('loginTab').textContent = translations[lang].loginTab;
        document.getElementById('signupTab').textContent = translations[lang].signupTab;
        document.getElementById('loginUsernameLabel').textContent = translations[lang].loginUsernameLabel;
        document.getElementById('loginPasswordLabel').textContent = translations[lang].loginPasswordLabel;
        document.getElementById('loginBtn').textContent = translations[lang].loginBtn;
        document.getElementById('signupUsernameLabel').textContent = translations[lang].signupUsernameLabel;
        document.getElementById('signupPasswordLabel').textContent = translations[lang].signupPasswordLabel;
        document.getElementById('gradeSelectLabel').textContent = translations[lang].gradeSelectLabel;
        document.getElementById('heroSelectLabel').textContent = translations[lang].heroSelectLabel;
        document.getElementById('signupBtn').textContent = translations[lang].signupBtn;
        document.getElementById('dashboardTitle').textContent = translations[lang].dashboardTitle;
        document.getElementById('welcomeTitle').textContent = translations[lang].welcomeTitle;
        document.getElementById('welcomeSubtitle').textContent = translations[lang].welcomeSubtitle;
        document.getElementById('logoutBtn').textContent = translations[lang].logoutBtn;
        document.getElementById('backToSubjectsBtn').textContent = translations[lang].backToSubjects;
        document.getElementById('nextQuestionBtn').textContent = translations[lang].nextQuestion;
        document.getElementById('resultsTitle').textContent = translations[lang].quizCompleted;
        document.getElementById('retryBtn').textContent = translations[lang].retryQuiz;
        document.getElementById('backToDashboardBtn').textContent = translations[lang].backToDashboard;

        if (currentUser) {
            showDashboard();
        }
    }

    // تبديل ألسنة الدخول والتسجيل
    document.getElementById('loginTab').addEventListener('click', () => switchTab('login'));
    document.getElementById('signupTab').addEventListener('click', () => switchTab('signup'));

    function switchTab(type) {
        document.getElementById('loginTab').classList.toggle('active', type === 'login');
        document.getElementById('signupTab').classList.toggle('active', type === 'signup');
        document.getElementById('loginContent').classList.toggle('active', type === 'login');
        document.getElementById('signupContent').classList.toggle('active', type === 'signup');
    }

    // معالجة نموذج إنشاء الحساب وحفظ البيانات في سوبابيز
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value;
        const grade = document.getElementById('gradeSelect').value;
        const avatar = document.querySelector('input[name="hero"]:checked').value;

        if(!username || !password || !grade) return;

        try {
            const { data: existingUser } = await supabaseClient.from('students').select('*').eq('username', username).maybeSingle();
            if(existingUser) {
                showToast(currentLang === 'ar' ? "اسم المستخدم مسجل مسبقاً!" : "Username already exists!", true);
                return;
            }

            const { data, error } = await supabaseClient.from('students').insert([
                { username: username, password: password, grade: grade, avatar: avatar, score: 0 }
            ]).select().single();

            if (error) throw error;

            showToast(currentLang === 'ar' ? "تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول." : "Account created successfully! Please login.");
            switchTab('login');
        } catch (err) {
            showToast(currentLang === 'ar' ? "حدث خطأ أثناء إنشاء الحساب" : "Error creating account", true);
        }
    });

    // معالجة نموذج تسجيل الدخول ومنع إعادة تحميل الصفحة
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) return;

        try {
            const { data: user, error } = await supabaseClient.from('students').select('*').eq('username', username).eq('password', password).maybeSingle();

            if (user) {
                currentUser = user;
                showToast(currentLang === 'ar' ? "مرحباً بك في لوحة التحكم!" : "Welcome to the dashboard!");
                showDashboard();
            } else {
                showToast(currentLang === 'ar' ? "اسم المستخدم أو كلمة المرور خاطئة" : "Invalid username or password", true);
            }
        } catch (err) {
            showToast(currentLang === 'ar' ? "خطأ في الاتصال بقاعدة البيانات" : "Database connection error", true);
        }
    });

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultsScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';

        document.getElementById('displayUsername').textContent = currentUser.username;
        document.getElementById('displayGrade').textContent = `${translations[currentLang].gradeText} ${currentUser.grade}`;
        document.getElementById('scoreDisplay').textContent = `${currentUser.score} ${translations[currentLang].scoreText}`;
        document.getElementById('userAvatar').textContent = currentUser.avatar || '👤';

        renderSubjects();
    }

    function renderSubjects() {
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = '';
        subjects.forEach(sub => {
            const card = document.createElement('div');
            card.className = 'subject-card';
            card.style.setProperty('--subject-color', sub.color);
            card.style.setProperty('--subject-color-light', sub.colorLight);
            
            card.innerHTML = `
                <div class="subject-icon">${sub.icon}</div>
                <div class="subject-name">${currentLang === 'ar' ? sub.nameAr : sub.nameEn}</div>
                <button class="start-quiz-btn">${translations[currentLang].startQuiz}</button>
            `;
            card.addEventListener('click', () => startQuiz(sub.id));
            grid.appendChild(card);
        });
    }

    function startQuiz(subjectId) {
        currentSubject = subjectId;
        currentQuestions = quizData[subjectId] || [];
        currentQuestionIndex = 0;
        scoreGained = 0;

        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        selectedOptionIndex = null;
        document.getElementById('nextQuestionBtn').disabled = true;

        const q = currentQuestions[currentQuestionIndex];
        document.getElementById('quizTitle').textContent = currentLang === 'ar' ? subjects.find(s=>s.id===currentSubject).nameAr : subjects.find(s=>s.id===currentSubject).nameEn;
        document.getElementById('quizProgress').textContent = `${currentQuestionIndex + 1}/${currentQuestions.length}`;
        document.getElementById('questionText').textContent = currentLang === 'ar' ? q.q_ar : q.q_en;

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
        currentOptions.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.addEventListener('click', () => selectOption(idx, btn));
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(index, clickedBtn) {
        if (selectedOptionIndex !== null) return;
        selectedOptionIndex = index;

        const q = currentQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');

        if (index === q.answer) {
            clickedBtn.classList.add('correct');
            scoreGained += 10;
        } else {
            clickedBtn.classList.add('incorrect');
            buttons[q.answer].classList.add('correct');
        }

        document.getElementById('nextQuestionBtn').disabled = false;
    }

    document.getElementById('nextQuestionBtn').addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    });

    async function endQuiz() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultsScreen').style.display = 'block';

        document.getElementById('resultsScore').textContent = `+ ${scoreGained} ${translations[currentLang].pts}`;

        const newTotalScore = (currentUser.score || 0) + scoreGained;
        const { error } = await supabaseClient.from('students').update({ score: newTotalScore }).eq('id', currentUser.id);

        if(!error) {
            currentUser.score = newTotalScore;
        }
    }

    document.getElementById('backToSubjectsBtn').addEventListener('click', showDashboard);
    document.getElementById('backToDashboardBtn').addEventListener('click', showDashboard);
    document.getElementById('retryBtn').addEventListener('click', () => startQuiz(currentSubject));

    document.getElementById('logoutBtn').addEventListener('click', () => {
        currentUser = null;
        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        showToast(currentLang === 'ar' ? "تم تسجيل الخروج" : "Logged out");
    });

    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
  </script>

<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة المعرفة | هبة كتانة</title>
  <link rel="icon" type="image/png" href="4.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            box-sizing: border-box;
            font-family: 'Cairo', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            overflow-x: hidden;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        .app-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 8px 40px 0 rgba(31, 38, 135, 0.45);
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #764ba2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .input-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .input-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        select.input-control option {
            background: #764ba2;
            color: #ffffff;
        }

        .avatar-selection {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .avatar-option {
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .avatar-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .avatar-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 10px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .avatar-box .icon {
            font-size: 28px;
        }

        .avatar-box .name {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }

        .avatar-option input:checked ~ .avatar-box {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            transform: translateY(-4px);
        }

        .primary-btn {
            width: 100%;
            background: #ffffff;
            color: #764ba2;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.95);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .dashboard {
            max-width: 800px;
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 2px solid #ffffff;
        }

        .user-details h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .user-details span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
        }

        .score-badge {
            background: #ffffff;
            color: #764ba2;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .action-icon {
            font-size: 40px;
            margin-bottom: 14px;
            display: inline-block;
        }

        .action-card h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .action-card p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 14px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-table th {
            font-weight: 700;
            color: rgba(255,255,255,0.7);
        }

        .leaderboard-row:hover {
            background: rgba(255,255,255,0.05);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #333333;
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: 600;
            z-index: 1000;
            animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.7s;
            font-family: 'Cairo', sans-serif;
            border-right: 4px solid #4caf50;
        }

        .toast.error {
            border-right-color: #f44336;
        }

        @keyframes slideUp {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        .logout-btn {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #ff8a80;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            margin-right: 10px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: rgba(244, 67, 54, 0.4);
            color: #ffffff;
        }

        @media(max-width: 576px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
            .avatar-selection {
                grid-template-columns: repeat(2, 1fr);
            }
        }
  </style>
 </head>
 <body class="h-full">
  <div class="app-wrapper">
   <div id="authCard" class="glass-card">
    <div class="tabs">
     <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button> 
     <button id="signupTab" class="tab-btn" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)">
     <div class="form-group">
      <label for="loginUser">اسم المستخدم</label> 
      <input type="text" id="loginUser" class="input-control" required placeholder="أدخل اسم المستخدم">
     </div>
     <div class="form-group">
      <label for="loginPass">كلمة المرور</label> 
      <input type="password" id="loginPass" class="input-control" required placeholder="••••••••">
     </div><button type="submit" class="primary-btn">انطلاق 🚀</button>
    </form>
    <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
     <div class="form-group">
      <label for="signupUser">اسم المستخدم</label> 
      <input type="text" id="signupUser" class="input-control" required placeholder="اختر اسم مستخدم متميز">
     </div>
     <div class="form-group">
      <label for="signupPass">كلمة المرور</label> 
      <input type="password" id="signupPass" class="input-control" required placeholder="••••••••">
     </div>
     <div class="form-group">
      <label for="userGrade">الصف الدراسي</label> <select id="userGrade" class="input-control" required> <option value="" disabled selected>اختر صفك الدراسي</option> <option value="7">الصف السابع</option> <option value="8">الصف الثامن</option> <option value="9">الصف التاسع</option> <option value="10">الصف العاشر</option> </select>
     </div>
     <div class="form-group">
      <label>اختر بطل رحلتك (الأفاتار)</label>
      <div class="avatar-selection">
       <label class="avatar-option"> <input type="radio" name="avatar" value="⚡" checked>
        <div class="avatar-box">
         <span class="icon">⚡</span> <span class="name">المفكر</span>
        </div> </label> <label class="avatar-option"> <input type="radio" name="avatar" value="🌟">
        <div class="avatar-box">
         <span class="icon">🌟</span> <span class="name">الذكي</span>
        </div> </label> <label class="avatar-option"> <input type="radio" name="avatar" value="🚀">
        <div class="avatar-box">
         <span class="icon">🚀</span> <span class="name">المكتشف</span>
        </div> </label> <label class="avatar-option"> <input type="radio" name="avatar" value="🔮">
        <div class="avatar-box">
         <span class="icon">🔮</span> <span class="name">العبقري</span>
        </div> </label>
      </div>
     </div><button type="submit" class="primary-btn">بدء الرحلة الآن 🎉</button>
    </form>
   </div>
   <div id="dashboardCard" class="glass-card dashboard">
    <div class="dashboard-header">
     <div class="user-info">
      <div id="displayAvatar" class="user-avatar">
       ⚡
      </div>
      <div class="user-details">
       <h3 id="displayUsername">مرحباً بك</h3> <span id="displayGrade">الصف الدراسي</span>
      </div>
     </div>
     <div style="display: flex; align-items: center;">
      <button class="logout-btn" onclick="handleLogout()">خروج</button>
      <div class="score-badge">
       🏆 <span id="displayScore">0</span> نقطة
      </div>
     </div>
    </div>
    <div id="mainDashboardView" class="action-grid">
     <div class="action-card" onclick="startQuest()">
      <span class="action-icon">🗺️</span>
      <h4>بدء المغامرة</h4>
      <p>انطلق في اختبارات ممتعة وتحديات علمية مذهلة</p>
     </div>
     <div class="action-card" onclick="viewLeaderboard()">
      <span class="action-icon">📊</span>
      <h4>لوحة الصدارة</h4>
      <p>شاهد ترتيبك بين أبطال ومكتشفي رحلة المعرفة</p>
     </div>
    </div>
    <div id="leaderboardView" style="display: none;">
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h4 style="font-size: 20px; font-weight: 700;">🏆 قائمة الأبطال المتصدرين</h4> <button class="primary-btn" style="margin: 0; width: auto; padding: 6px 16px; font-size: 14px;" onclick="closeLeaderboard()">العودة للوحة التحكم</button>
     </div>
     <div style="max-height: 300px; overflow-y: auto;">
      <table class="leaderboard-table">
       <thead>
        <tr>
         <th>الترتيب</th>
         <th>البطل</th>
         <th>الصف</th>
         <th>النقاط</th>
        </tr>
       </thead>
       <tbody id="leaderboardBody">
        </tbody>
      </table>
     </div>
    </div>
   </div>
  </div>
  <script>
        // إعدادات الاتصال بـ Supabase
        const SUPABASE_URL = "https://xjcsvvrzqjpkaxuwhebl.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_C6QsfadUxnRFV0Nvuaj_Dg_0ttlkFAB";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        function switchTab(type) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');

            if(type === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        // إنشاء حساب جديد
        async function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signupUser').value.trim();
            const password = document.getElementById('signupPass').value;
            const gradeNum = document.getElementById('userGrade').value;
            const avatar = document.querySelector('input[name="avatar"]:checked').value;

            const gradeMap = { "7": "السابع", "8": "الثامن", "9": "التاسع", "10": "العاشر" };
            const gradeText = gradeMap[gradeNum] || "غير محدد";

            // تكوين بريد إلكتروني وهمي بالاعتماد على اسم المستخدم لتسهيل الدخول
            const fakeEmail = `${username.toLowerCase()}@knowledgequest.com`;

            // 1. إنشاء الحساب في قائمة Auth العامة
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: fakeEmail,
                password: password
            });

            if (authError) {
                showToast(authError.message, true);
                return;
            }

            if (authData.user) {
                // 2. إدخال التفاصيل الإضافية بجدول profiles
                const { error: profileError } = await supabase.from('profiles').insert([
                    { 
                        id: authData.user.id, 
                        username: username, 
                        grade: gradeText, 
                        avatar: avatar, 
                        score: 0 
                    }
                ]);

                if (profileError) {
                    showToast("حدث خطأ أثناء حفظ بيانات الملف الشخصي", true);
                    console.error(profileError);
                } else {
                    showToast("تم إنشاء حسابك المتميز بنجاح! يمكنك الدخول الآن.");
                    switchTab('login');
                    document.getElementById('loginUser').value = username;
                }
            }
        }

        // تسجيل الدخول
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;

            const fakeEmail = `${username.toLowerCase()}@knowledgequest.com`;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: fakeEmail,
                password: password
            });

            if (error) {
                showToast("اسم المستخدم أو كلمة المرور غير صحيحة", true);
                return;
            }

            currentUser = data.user;

            // جلب بيانات الطالب من جدول profiles
            const { data: profile, error: pError } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (profile) {
                userProfile = profile;
                showToast("مرحباً بك في رحلة المعرفة! 🚀");
                showDashboard();
            } else {
                showToast("لم يتم العثور على بيانات إضافية للملف الشخصي", true);
            }
        }

        function showDashboard() {
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'block';
            
            document.getElementById('displayAvatar').textContent = userProfile.avatar;
            document.getElementById('displayUsername').textContent = userProfile.username;
            document.getElementById('displayGrade').textContent = `الصف ${userProfile.grade}`;
            document.getElementById('displayScore').textContent = userProfile.score;
        }

        // محاكاة انتهاء تحدي وإضافة نقاط جديدة كمثال
        async function startQuest() {
            showToast("انطلقت المغامرة! تم منحك 10 نقاط افتراضية للنجاح 🎉");
            
            const newScore = userProfile.score + 10;
            
            // تحديث السكور في Supabase
            const { error } = await supabase
                .from('profiles')
                .update({ score: newScore })
                .eq('id', currentUser.id);

            if (!error) {
                userProfile.score = newScore;
                document.getElementById('displayScore').textContent = newScore;
            } else {
                console.error("خطأ في تحديث السكور:", error);
            }
        }

        // عرض لوحة الصدارة من داتا حية بـ Supabase
        async function viewLeaderboard() {
            document.getElementById('mainDashboardView').style.display = 'none';
            document.getElementById('leaderboardView').style.display = 'block';

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">جاري تحميل الأبطال...</td></tr>';

            // سحب أعلى 10 طلاب نقاطاً من جدول profiles
            const { data: topUsers, error } = await supabase
                .from('profiles')
                .select('username, grade, avatar, score')
                .order('score', { ascending: false })
                .limit(10);

            if (error) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">فشل جلب البيانات</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            topUsers.forEach((user, index) => {
                const row = document.createElement('tr');
                row.className = 'leaderboard-row';
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.avatar} ${user.username}</td>
                    <td>${user.grade}</td>
                    <td style="font-weight:700; color:#fff;">${user.score} pts</td>
                `;
                tbody.appendChild(row);
            });
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardView').style.display = 'none';
            document.getElementById('mainDashboardView').style.display = 'grid';
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            userProfile = null;
            document.getElementById('dashboardCard').style.display = 'none';
            document.getElementById('authCard').style.display = 'block';
            showToast("تم تسجيل الخروج بنجاح.");
        }

        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;\
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
 </body>
</html>

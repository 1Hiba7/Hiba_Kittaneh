  <style>
    body {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }
    
    .cosmic-bg {
      background: linear-gradient(135deg, #1a0033 0%, #0d1b2a 30%, #1b263b 60%, #0f0a1e 100%);
      position: relative;
      overflow: hidden;
    }
    
    .cosmic-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(75, 0, 130, 0.15) 0%, transparent 50%);
      animation: cosmicPulse 8s ease-in-out infinite;
    }
    
    @keyframes cosmicPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .stars-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    
    .star-particle {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    
    /* زر العودة للموسوعة الرئيسية */
    .return-to-encyclopedia {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .return-to-encyclopedia:hover {
      background: #1e90ff;
      border-color: #1e90ff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 144, 255, 0.4);
    }
    
    .return-icon {
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    
    .return-to-encyclopedia:hover .return-icon {
      transform: scale(1.1);
    }
    
    .card-container {
      background: rgba(15, 10, 45, 0.85);
      border: 2px solid rgba(138, 43, 226, 0.4);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 0 40px rgba(138, 43, 226, 0.3),
        0 0 80px rgba(75, 0, 130, 0.2),
        inset 0 0 60px rgba(138, 43, 226, 0.05);
      overflow: hidden;
      position: relative;
    }
    
    .card-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, 
        transparent 0%, 
        rgba(138, 43, 226, 0.2) 25%, 
        transparent 50%, 
        rgba(75, 0, 130, 0.2) 75%, 
        transparent 100%);
      border-radius: 24px;
      animation: borderGlow 4s linear infinite;
      z-index: -1;
    }
    
    @keyframes borderGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .svg-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(138, 43, 226, 0.1) 0%, transparent 70%);
      overflow: visible;
      width: 100%;
      height: 100%;
      min-height: 400px;
    }
    
    .glow-effect {
      filter: drop-shadow(0 0 20px currentColor) drop-shadow(0 0 40px currentColor);
    }
    
    .stage-btn {
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.3) 0%, rgba(75, 0, 130, 0.3) 100%);
      border: 1px solid rgba(138, 43, 226, 0.5);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      color: #e0e7ff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .stage-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    
    .stage-btn:hover::before {
      transform: translateX(100%);
    }
    
    .stage-btn:hover {
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.5) 0%, rgba(75, 0, 130, 0.5) 100%);
      border-color: rgba(138, 43, 226, 0.8);
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
      transform: translateY(-2px);
    }
    
    .stage-btn.active {
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.7) 0%, rgba(75, 0, 130, 0.7) 100%);
      border-color: #8a2be2;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.8);
    }
    
    .text-panel {
      background: rgba(10, 5, 30, 0.6);
      border-right: 2px solid rgba(138, 43, 226, 0.3);
    }
    
    .path-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .path-btn {
      padding: 24px;
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.2) 0%, rgba(75, 0, 130, 0.2) 100%);
      border: 2px solid rgba(138, 43, 226, 0.4);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .path-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .path-btn:hover::before {
      opacity: 1;
    }
    
    .path-btn:hover {
      transform: scale(1.05);
      border-color: #8a2be2;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.6);
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 15px currentColor); }
      50% { filter: drop-shadow(0 0 30px currentColor) drop-shadow(0 0 45px currentColor); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .slide-in-left {
      animation: slideInLeft 0.5s ease-out;
    }
    
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 768px) {
      .return-to-encyclopedia {
        padding: 10px;
        top: 10px;
        right: 10px;
      }
      
      .return-text {
        display: none;
      }
      
      .return-icon {
        width: 24px;
        height: 24px;
      }
      
      .card-container {
        flex-direction: column;
      }
      
      .text-panel {
        border-right: none;
        border-top: 2px solid rgba(138, 43, 226, 0.3);
      }
      
      .path-selector {
        grid-template-columns: 1fr;
      }
    }
  </style>

    function createStarsField() {
      const field = document.getElementById('starsField');
      field.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star-particle';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = (Math.random() * 2 + 1) + 'px';
        star.style.height = star.style.width;
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        star.style.animationDelay = Math.random() * 3 + 's';
        field.appendChild(star);
      }
    }

    function selectPath(path) {
      currentPath = path;
      currentStage = 'nebula';
      
      document.getElementById('pathSelection').classList.add('hidden');
      document.getElementById('mainCard').classList.remove('hidden');
      document.getElementById('mainCard').classList.add('fade-in');
      
      updateStage();
    }
    
    function updateStage() {
      const data = stagesData[currentPath][currentStage];
      
      document.getElementById('stageTitle').textContent = data.title;
      document.getElementById('stageDescription').textContent = data.description;
      
      const container = document.getElementById('svgContainer');
      container.innerHTML = getSVG(currentStage);
      container.classList.add('fade-in');
      setTimeout(() => container.classList.remove('fade-in'), 500);
      
      updateButtons();
    }
    
    function updateButtons() {
      const buttonsContainer = document.getElementById('stageButtons');
      buttonsContainer.innerHTML = '';
      
      const stages = Object.keys(stagesData[currentPath]);
      
      if (currentPath === 'medium') {
        stages.forEach(stage => {
          const btn = document.createElement('button');
          btn.className = 'stage-btn w-full py-3 px-4 rounded-lg font-bold text-sm transition-all ' + 
                         (stage === currentStage ? 'active' : '');
          btn.textContent = stagesData[currentPath][stage].title;
          btn.onclick = () => {
            currentStage = stage;
            updateStage();
          };
          buttonsContainer.appendChild(btn);
        });
      } else {
        const regularStages = stages.filter(s => s !== 'neutronStar' && s !== 'blackHole');
        
        regularStages.forEach(stage => {
          const btn = document.createElement('button');
          btn.className = 'stage-btn w-full py-3 px-4 rounded-lg font-bold text-sm transition-all ' + 
                         (stage === currentStage ? 'active' : '');
          btn.textContent = stagesData[currentPath][stage].title;
          btn.onclick = () => {
            currentStage = stage;
            updateStage();
          };
          buttonsContainer.appendChild(btn);
        });
        
        if (currentStage === 'supernova' || currentStage === 'neutronStar' || currentStage === 'blackHole') {
          const divider = document.createElement('div');
          divider.className = 'text-center text-sm text-purple-400 py-2';
          divider.textContent = '↓ النهاية المحتملة ↓';
          buttonsContainer.appendChild(divider);
          
          const finalGrid = document.createElement('div');
          finalGrid.className = 'grid grid-cols-2 gap-2';
          
          const neutronBtn = document.createElement('button');
          neutronBtn.className = 'stage-btn py-3 px-4 rounded-lg font-bold text-xs transition-all ' + 
                                (currentStage === 'neutronStar' ? 'active' : '');
          neutronBtn.textContent = 'نجم نيوتروني';
          neutronBtn.onclick = () => {
            currentStage = 'neutronStar';
            updateStage();
          };
          
          const bhBtn = document.createElement('button');
          bhBtn.className = 'stage-btn py-3 px-4 rounded-lg font-bold text-xs transition-all ' + 
                           (currentStage === 'blackHole' ? 'active' : '');
          bhBtn.textContent = 'ثقب أسود';
          bhBtn.onclick = () => {
            currentStage = 'blackHole';
            updateStage();
          };
          
          finalGrid.appendChild(neutronBtn);
          finalGrid.appendChild(bhBtn);
          buttonsContainer.appendChild(finalGrid);
        }
      }
    }
    
    function resetSimulation() {
      currentPath = null;
      currentStage = null;
      
      document.getElementById('mainCard').classList.add('hidden');
      document.getElementById('pathSelection').classList.remove('hidden');
      document.getElementById('pathSelection').classList.add('fade-in');
      setTimeout(() => document.getElementById('pathSelection').classList.remove('fade-in'), 500);
    }
    
    async function onConfigChange(config) {
      const mainTitle = document.getElementById('mainTitle');
      const footerText = document.getElementById('footerText');
      
      if (mainTitle) {
        mainTitle.textContent = config.main_title || defaultConfig.main_title;
      }
      if (footerText) {
        footerText.textContent = config.footer_text || defaultConfig.footer_text;
      }
    }
    
    createStarsField();
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({

          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['main_title', config.main_title || defaultConfig.main_title],
          ['footer_text', config.footer_text || defaultConfig.footer_text]
        ])
      });
    }

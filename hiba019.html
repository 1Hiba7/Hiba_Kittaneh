  <style>
        body {
            box-sizing: border-box;
            font-family: 'Almarai', sans-serif;
        }
        
        ::selection {
            background-color: #3b82f6;
            color: white;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: fall 2s linear;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .shake {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .celebration {
            animation: celebration 0.6s ease-out;
        }
        
        @keyframes celebration {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1); }
        }
        
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .number-button {
            transition: all 0.2s;
        }
        
        .number-button:active {
            transform: scale(0.95);
        }
        
        .return-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .return-button:hover {
            background: #1e90ff;
            border-color: #1e90ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.4);
        }
        
        .return-button svg {
            width: 20px;
            height: 20px;
        }
        
        @media (max-width: 768px) {
            .return-button {
                padding: 10px;
                border-radius: 50%;
            }
            
            .return-button span {
                display: none;
            }
            
            .return-button svg {
                width: 24px;
                height: 24px;
            }
        }
    </style>

 shadow-lg hover:shadow-xl">٠</button> <button onclick="checkAnswer()" class="number-button bg-gradient-to-br from-green-400 to-green-600 text-white py-6 rounded-xl text-2xl font-bold shadow-lg hover:shadow-xl">✓</button>

  <script>
        const defaultConfig = {
            game_title: 'تحدي عبقري الرياضيات',
            correct_message: 'رائع! إجابة صحيحة',
            wrong_message_prefix: 'حاول مرة أخرى! الإجابة الصحيحة هي',
            footer_text: 'جميع الحقوق محفوظة لـ هبة كتانة/قلقيلية الشرعية/وزارة الأوقاف/فلسطين'
        };

        let currentTable = null;
        let currentNum1 = 0;
        let currentNum2 = 0;
        let score = 0;
        let timerInterval = null;
        let seconds = 0;
        let userAnswer = '';
        let currentDifficulty = null;
        let usedQuestions = new Set();
        let totalTimeLimit = 0;

        const arabicToEnglish = {'٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'};
        const englishToArabic = {'0': '٠', '1': '١', '2': '٢', '3': '٣', '4': '٤', '5': '٥', '6': '٦', '7': '٧', '8': '٨', '9': '٩'};

        function convertToArabicNumerals(num) {
            return num.toString().split('').map(d => englishToArabic[d] || d).join('');
        }

        function convertToEnglishNumerals(str) {
            return str.split('').map(d => arabicToEnglish[d] || d).join('');
        }

        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function showDifficultyMenu(table) {
            currentTable = table;
            document.getElementById('entry-screen').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.remove('hidden');
        }

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            score = 0;
            seconds = 0;
            usedQuestions.clear();
            
            // تحديد مدة الوقت حسب مستوى الصعوبة
            if (difficulty === 'easy') {
                totalTimeLimit = 120; // دقيقتان
            } else if (difficulty === 'medium') {
                totalTimeLimit = 60; // دقيقة واحدة
            } else if (difficulty === 'hard') {
                totalTimeLimit = 30; // 30 ثانية
            }
            
            updateScore();
            
            document.getElementById('difficulty-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            startTimer();
            generateQuestion();
        }

        function generateQuestion() {
            userAnswer = '';
            document.getElementById('answer-display').value = '';
            document.getElementById('feedback').innerHTML = '';
            
            let num1, num2, questionKey;
            
            // توليد أسئلة بدون تكرار
            do {
                if (currentTable === 'random') {
                    num1 = Math.floor(Math.random() * 12) + 1;
                    num2 = Math.floor(Math.random() * 12) + 1;
                } else {
                    num1 = currentTable;
                    num2 = Math.floor(Math.random() * 12) + 1;
                }
                
                questionKey = `${num1}x${num2}`;
            } while (usedQuestions.has(questionKey));
            
            usedQuestions.add(questionKey);
            currentNum1 = num1;
            currentNum2 = num2;
            
            document.getElementById('num1').textContent = convertToArabicNumerals(currentNum1);
            document.getElementById('num2').textContent = convertToArabicNumerals(currentNum2);
        }

        function addDigit(digit) {
            userAnswer += digit;
            document.getElementById('answer-display').value = userAnswer;
        }

        function clearAnswer() {
            userAnswer = '';
            document.getElementById('answer-display').value = '';
        }

        function checkAnswer() {
            if (userAnswer === '') return;
            
            const correctAnswer = currentNum1 * currentNum2;
            const userAnswerEnglish = parseInt(convertToEnglishNumerals(userAnswer));
            
            const feedback = document.getElementById('feedback');
            const questionContainer = document.getElementById('question-container');
            
            if (userAnswerEnglish === correctAnswer) {
                const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
                feedback.innerHTML = `<span class="text-green-600">✨ ${config.correct_message || defaultConfig.correct_message} ✨</span>`;
                questionContainer.classList.add('celebration');
                score += 10;
                updateScore();
                createConfetti();
                
                setTimeout(() => {
                    questionContainer.classList.remove('celebration');
                    generateQuestion();
                }, 1500);
            } else {
                const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
                const wrongPrefix = config.wrong_message_prefix || defaultConfig.wrong_message_prefix;
                feedback.innerHTML = `<span class="text-red-600">${wrongPrefix} ${convertToArabicNumerals(correctAnswer)}</span>`;
                questionContainer.classList.add('shake');
                
                setTimeout(() => {
                    questionContainer.classList.remove('shake');
                    userAnswer = '';
                    document.getElementById('answer-display').value = '';
                }, 1000);
            }
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#c7ceea'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = convertToArabicNumerals(score);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const remainingSeconds = totalTimeLimit - elapsedSeconds;
                
                // فحص انتهاء الوقت
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '٠:٠٠';
                    endGame();
                    return;
                }
                
                const mins = Math.floor(remainingSeconds / 60);
                const secs = remainingSeconds % 60;
                const formattedSecs = secs.toString().padStart(2, '0');
                const timeStr = `${mins}:${formattedSecs}`;
                document.getElementById('timer').textContent = convertToArabicNumerals(timeStr);
            }, 100);
        }

        function endGame() {
            const finalScore = score;
            const difficulty = {
                'easy': 'سهل 🟢',
                'medium': 'عادي 🟡',
                'hard': 'صعب 🔴'
            }[currentDifficulty] || '';
            
            const tableNum = currentTable === 'random' ? 'عشوائي 🎲' : `جدول ${convertToArabicNumerals(currentTable)}`;
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('entry-screen').classList.remove('hidden');
            
            alert(`🎉 انتهت اللعبة!\n\n📊 ${tableNum}\n🎯 المستوى: ${difficulty}\n⭐ النقاط النهائية: ${convertToArabicNumerals(finalScore)}`);
        }

        function backToMenu() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.add('hidden');
            document.getElementById('entry-screen').classList.remove('hidden');
        }

        async function onConfigChange(config) {
            document.getElementById('game-title').textContent = config.game_title || defaultConfig.game_title;
            document.getElementById('footer-text').textContent = config.footer_text || defaultConfig.footer_text;
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ['game_title', config.game_title || defaultConfig.game_title],
                    ['correct_message', config.correct_message || defaultConfig.correct_message],
                    ['wrong_message_prefix', config.wrong_message_prefix || defaultConfig.wrong_message_prefix],
                    ['footer_text', config.footer_text || defaultConfig.footer_text]
                ])
            });
        }

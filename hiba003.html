<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة شهادات التقدير التفاعلية | هبة كتانة</title>
  <link rel="icon" type="image/png" href="3.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap');
        
        body {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }
        /* حل مشكلة المستطيل الذهبي عند التصدير كصورة */
        .gold-text {
            color: #b89047;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10000;
        }
        
        .theme-gold { background: #fdfbf7; border-color: #d4af37; color: #85581A; }
        .theme-royal { background: #f4f6fa; border-color: #1e3a8a; color: #1e3a8a; }
        .theme-emerald { background: #f3f9f6; border-color: #065f46; color: #065f46; }
        .theme-sky { background: #f0f9ff; border-color: #0369a1; color: #0369a1; }
        .theme-rose { background: #fff5f5; border-color: #9d174d; color: #9d174d; }

        /* ستايل الصورة القابلة للسحب والتحريك */
        .draggable-image {
            position: absolute;
            cursor: move;
            touch-action: none;
            display: inline-block;
        }
        .frame-none { border: none; }
        .frame-circle { border-radius: 50%; }
        .frame-gold { border: 4px double #d4af37; padding: 2px; }
        .frame-royal { border: 3px solid #1e3a8a; padding: 2px; }
  </style>
 </head>
 <body class="h-full bg-gradient-to-br from-slate-50 via-amber-50 to-orange-50">

  <div id="app" class="w-full h-full overflow-auto p-4 md:p-8"></div>

  <script>
        const SUPABASE_URL = "https://lxyyrdhvcaqqdvuucnua.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Y-_Th8vqG4IWIg2JouB5cg_cvzL2vA6";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentView = 'login'; 
        let currentRecords = [];

        // متغيرات الصورة المرفوعة والتحكم بها
        let uploadedImageSrc = '';
        let imageSize = 100;
        let imageFrame = 'frame-none';
        let isDragging = false;
        let startX, startY, initialLeft = 50, initialTop = 50;

        let formData = {
            introText: 'تتقدم إدارة المدرسة بالامتنان والتقدير لـ',
            recipientName: 'الطالب المتميز',
            message: 'لقد بذلت جهداً كبيراً هذا العام فهنيئاً لك وشكراً لك على كل ما قدمته للجنة التكنولوجية',
            senderName: 'إدارة المدرسة الشرعية',
            certificateType: 'appreciation',
            theme: 'theme-gold',
            fontFamily: 'Amiri'
        };

        async function initApp() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                currentView = 'dashboard';
                await loadUserCertificates();
            } else {
                currentView = 'login';
            }
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (currentView === 'login') app.innerHTML = renderLoginView();
            else if (currentView === 'register') app.innerHTML = renderRegisterView();
            else if (currentView === 'dashboard') app.innerHTML = renderDashboardView();
            else if (currentView === 'gallery') app.innerHTML = renderGalleryView();
            
            if (currentView === 'dashboard') {
                setupDraggable();
            }
        }

        function renderLoginView() {
            return `
            <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-amber-200">
                <h2 class="text-2xl font-bold text-center text-amber-800 mb-6">منصة الشهادات التفاعلية السحابية</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="login-email" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="name@domain.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="login-password" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••">
                    </div>
                    <button onclick="handleLogin()" class="w-full py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 transition">تسجيل الدخول</button>
                    <p class="text-center text-sm text-gray-600 mt-4">ليس لديك حساب؟ <span onclick="switchView('register')" class="text-amber-600 cursor-pointer underline">أنشئ حساباً مجانياً</span></p>
                </div>
            </div>`;
        }

        function renderRegisterView() {
            return `
            <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-amber-200">
                <h2 class="text-2xl font-bold text-center text-amber-800 mb-6">إنشاء حساب جديد وتفعيل مجاني</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="reg-email" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="reg-password" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="لا تقل عن 6 خانات">
                    </div>
                    <button onclick="handleRegister()" class="w-full py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition">إرسال رابط التحقق للجيميل</button>
                    <p class="text-center text-sm text-gray-600 mt-4">لديك حساب بالفعل؟ <span onclick="switchView('login')" class="text-amber-600 cursor-pointer underline">تسجيل الدخول</span></p>
                </div>
            </div>`;
        }

        function renderDashboardView() {
            return `
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-8">
                    <span class="font-bold text-amber-900">مرحباً بكِ في نظام التصميم الذكي المطور</span>
                    <div class="flex gap-2">
                        <button onclick="switchView('gallery')" class="px-4 py-2 bg-amber-100 text-amber-800 rounded-xl font-semibold hover:bg-amber-200">📂 معرض شهاداتي السحابي</button>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold hover:bg-red-200">خروج</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- لوحة التحكم بالتصميم والألوان والصور -->
                    <div class="bg-white p-6 rounded-2xl shadow-lg space-y-4 lg:col-span-1">
                        <h3 class="text-xl font-bold text-gray-800 border-b pb-2">لوحة تخصيص الشهادة</h3>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">النص الافتتاحي للشهادة</label>
                            <input type="text" id="introText" value="${formData.introText}" oninput="updatePreview()" class="w-full p-3 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم الطالب/ة</label>
                            <input type="text" id="recipientName" value="${formData.recipientName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نص الثناء</label>
                            <textarea id="message" rows="3" oninput="updatePreview()" class="w-full p-3 border rounded-xl text-sm">${formData.message}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المعلمة أو الإدارة</label>
                            <input type="text" id="senderName" value="${formData.senderName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl">
                        </div>
                        
                        <!-- إضافة أدوات الصورة المرفوعة -->
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-3">
                            <label class="block text-xs font-bold text-amber-800">✨ إضافة شعار أو صورة للشهادة</label>
                            <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">
                            
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">حجم الصورة المرفوعة</label>
                                <input type="range" id="imageSizeSlider" min="40" max="200" value="${imageSize}" oninput="changeImageSize(this.value)" class="w-full accent-amber-600">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-600 mb-1">إطار الصورة</label>
                                <select id="imageFrameSelect" onchange="changeImageFrame(this.value)" class="w-full p-1.5 text-xs border rounded-lg bg-white">
                                    <option value="frame-none">بدون إطار</option>
                                    <option value="frame-circle">شكل دائري</option>
                                    <option value="frame-gold">إطار ذهبي ملكي</option>
                                    <option value="frame-royal">إطار كحلي مدرسي</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">لون وقالب الشهادة</label>
                            <select id="certificateTheme" onchange="updatePreview()" class="w-full p-3 border rounded-xl">
                                <option value="theme-gold" ${formData.theme === 'theme-gold' ? 'selected' : ''}>الملكي الذهبي الكلاسيكي</option>
                                <option value="theme-royal" ${formData.theme === 'theme-royal' ? 'selected' : ''}>الأزرق الملوكي الفاخر</option>
                                <option value="theme-emerald" ${formData.theme === 'theme-emerald' ? 'selected' : ''}>الزمردي الأخضر التعليمي</option>
                                <option value="theme-sky" ${formData.theme === 'theme-sky' ? 'selected' : ''}>السماوي الهادئ المتميز</option>
                                <option value="theme-rose" ${formData.theme === 'theme-rose' ? 'selected' : ''}>الوردي المخملي المبدع</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نوع الخط العربي</label>
                            <select id="certificateFont" onchange="updatePreview()" class="w-full p-3 border rounded-xl">
                                <option value="Amiri" ${formData.fontFamily === 'Amiri' ? 'selected' : ''}>خط أميري (عريق ومزخرف)</option>
                                <option value="Tajawal" ${formData.fontFamily === 'Tajawal' ? 'selected' : ''}>خط تجوال (حديث وأنيق)</option>
                                <option value="Cairo" ${formData.fontFamily === 'Cairo' ? 'selected' : ''}>خط القاهرة (هندسي وجذاب)</option>
                            </select>
                        </div>

                        <div class="pt-2 flex gap-4">
                            <button onclick="saveCertificateToSupabase()" class="flex-1 py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 shadow-md transition text-sm">💾 حفظ في السحابة</button>
                            <button onclick="downloadCertificateAsPNG()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 shadow-md transition text-sm">🖼️ تحميل كصورة</button>
                        </div>
                    </div>

                    <!-- صندوق المعاينة الحية للشهادة الجمالية والتفاعلية -->
                    <div class="flex items-center justify-center lg:col-span-2">
                        <div id="certificate-capture-area" class="w-full max-w-2xl border-[12px] p-12 rounded-xl shadow-2xl relative text-center min-h-[480px] flex flex-col justify-between theme-gold overflow-hidden" style="font-family: 'Amiri', serif;">
                            
                            <!-- حاوية الصورة المرفوعة التفاعلية داخل الشهادة -->
                            <div id="imageContainer" class="draggable-image ${imageFrame}" style="left: ${initialLeft}px; top: ${initialTop}px; display: ${uploadedImageSrc ? 'block' : 'none'};">
                                <img id="certCustomImage" src="${uploadedImageSrc}" style="width: ${imageSize}px; height: auto;" class="${imageFrame === 'frame-circle' ? 'rounded-full' : ''}">
                            </div>

                            <div class="font-bold text-2xl tracking-widest border-b border-opacity-20 pb-3 mb-6" id="view-cert-title" style="color: inherit;">شهادة تقدير وعرفان</div>
                            
                            <div class="my-auto space-y-6 z-10">
                                <p class="opacity-80 text-base" id="view-intro">${formData.introText}</p>
                                <h2 class="text-4xl font-bold gold-text" id="view-recipient" style="text-shadow: 0px 1px 1px rgba(0,0,0,0.1);">${formData.recipientName}</h2>
                                <p class="leading-relaxed px-8 text-lg" id="view-message">${formData.message}</p>
                            </div>
                            
                            <div class="flex justify-between items-center mt-8 pt-4 border-t border-opacity-20 text-sm z-10">
                                <div class="opacity-70">التاريخ: ${new Date().toLocaleDateString('ar-EG')}</div>
                                <div class="font-bold text-lg" id="view-sender">${formData.senderName}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderGalleryView() {
            let recordsHTML = '';
            if (currentRecords.length === 0) {
                recordsHTML = '<p class="col-span-full text-center text-gray-500 py-12">لم تقم بحفظ أي شهادات سحابياً حتى الآن.</p>';
            } else {
                currentRecords.forEach(cert => {
                    recordsHTML += `
                    <div class="p-6 rounded-xl shadow border flex flex-col justify-between ${cert.theme || 'theme-gold'}" style="font-family: ${cert.font_family || 'Amiri'}, sans-serif;">
                        <div>
                            <h4 class="text-lg font-bold">${cert.recipient_name}</h4>
                            <p class="text-sm my-2 line-clamp-2 opacity-90">${cert.message}</p>
                            <small class="opacity-70">بواسطة: ${cert.sender_name}</small>
                        </div>
                        <button onclick="deleteCertificate('${cert.id}')" class="mt-4 w-full py-1.5 bg-red-600 bg-opacity-10 text-red-700 text-sm font-semibold rounded-lg hover:bg-opacity-20 transition">🗑️ حذف سحابياً</button>
                    </div>`;
                });
            }

            return `
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-amber-900">📂 معرض شهاداتي السحابي المميز</h2>
                    <button onclick="switchView('dashboard')" class="px-4 py-2 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700">➕ صمم شهادة جديدة</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${recordsHTML}
                </div>
            </div>`;
        }

        // معالجة رفع وتحميل الصورة من جهاز المستخدم
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageSrc = e.target.result;
                    const imgEl = document.getElementById('certCustomImage');
                    const containerEl = document.getElementById('imageContainer');
                    if (imgEl && containerEl) {
                        imgEl.src = uploadedImageSrc;
                        containerEl.style.display = 'block';
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function changeImageSize(size) {
            imageSize = size;
            const imgEl = document.getElementById('certCustomImage');
            if (imgEl) imgEl.style.width = `${size}px`;
        }

        function changeImageFrame(frame) {
            imageFrame = frame;
            const containerEl = document.getElementById('imageContainer');
            const imgEl = document.getElementById('certCustomImage');
            if (containerEl && imgEl) {
                containerEl.className = `draggable-image ${frame}`;
                if (frame === 'frame-circle') imgEl.classList.add('rounded-full');
                else imgEl.classList.remove('rounded-full');
            }
        }

        // برمجة عملية السحب والإفلات للماوس واللمس للهواتف
        function setupDraggable() {
            const container = document.getElementById('imageContainer');
            const area = document.getElementById('certificate-capture-area');
            if (!container || !area) return;

            container.addEventListener('mousedown', dragStart);
            area.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            container.addEventListener('touchstart', dragStart, { passive: false });
            area.addEventListener('touchmove', dragMove, { passive: false });
            window.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                startX = clientX - container.offsetLeft;
                startY = clientY - container.offsetTop;
            }

            function dragMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let x = clientX - startX;
                let y = clientY - startY;

                // إبقاء الصورة داخل حدود الشهادة
                x = Math.max(0, Math.min(x, area.clientWidth - container.clientWidth));
                y = Math.max(0, Math.min(y, area.clientHeight - container.clientHeight));

                container.style.left = `${x}px`;
                container.style.top = `${y}px`;
                initialLeft = x;
                initialTop = y;
            }

            if (typeof dragEnd !== 'function') {
                window.dragEnd = function() { isDragging = false; };
            } else {
                dragEnd = function() { isDragging = false; };
            }
        }

        function switchView(view) {
            currentView = view;
            renderApp();
        }

        function updatePreview() {
            formData.introText = document.getElementById('introText').value;
            formData.recipientName = document.getElementById('recipientName').value;
            formData.message = document.getElementById('message').value;
            formData.senderName = document.getElementById('senderName').value;
            formData.theme = document.getElementById('certificateTheme').value;
            formData.fontFamily = document.getElementById('certificateFont').value;

            document.getElementById('view-intro').textContent = formData.introText;
            document.getElementById('view-recipient').textContent = formData.recipientName;
            document.getElementById('view-message').textContent = formData.message;
            document.getElementById('view-sender').textContent = formData.senderName;
            
            const previewArea = document.getElementById('certificate-capture-area');
            previewArea.className = `w-full max-w-2xl border-[12px] p-12 rounded-xl shadow-2xl relative text-center min-h-[480px] flex flex-col justify-between ${formData.theme} overflow-hidden`;
            previewArea.style.fontFamily = `'${formData.fontFamily}', sans-serif`;
        }

        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            if (!email || !password) return showToast('⚠️ يرجى ملء كافة الحقول');

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) showToast('❌ خطأ: ' + error.message);
            else {
                showToast('🎉 تفقد بريدك الإلكتروني الآن واضغط على رابط التحقق للتفعيل!');
                switchView('login');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) return showToast('⚠️ يرجى إدخال البيانات');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) showToast('❌ خطأ: تأكد من تفعيل الحساب من الجيميل أولاً.');
            else {
                currentUser = data.user;
                showToast('👋 أهلاً بكِ في السحابة!');
                currentView = 'dashboard';
                await loadUserCertificates();
                renderApp();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            currentView = 'login';
            renderApp();
        }

        async function saveCertificateToSupabase() {
            if (!currentUser) return showToast('⚠️ سجل الدخول أولاً');
            
            const { error } = await supabaseClient.from('certificates').insert([
                {
                    user_id: currentUser.id,
                    recipient_name: formData.recipientName,
                    message: formData.message,
                    sender_name: formData.senderName,
                    certificate_type: formData.certificateType,
                    theme: formData.theme,
                    font_family: formData.fontFamily
                }
            ]);

            if (error) showToast('❌ فشل الحفظ: ' + error.message);
            else {
                showToast('💾 تم حفظ الشهادة وقالبها اللوني في السحابة بنجاح!');
                await loadUserCertificates();
            }
        }

        async function loadUserCertificates() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('certificates')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (!error && data) currentRecords = data;
        }

        async function deleteCertificate(id) {
            const { error } = await supabaseClient.from('certificates').delete().eq('id', id);
            if (!error) {
                showToast('🗑️ تم الحذف بنجاح من السحابة');
                await loadUserCertificates();
                renderApp();
            }
        }

        // تعديل كود استخراج الصور لمنع التداخل وحل مشكلة المستطيل الذهبي تماماً
        async function downloadCertificateAsPNG() {
            const area = document.getElementById('certificate-capture-area');
            if (!area) return;
            showToast('⏳ جاري استخراج الصورة الحية بدون أي تداخلات أو مشاكل بصرية...');
            
            const canvas = await html2canvas(area, { 
                scale: 2, 
                useCORS: true,
                logging: false,
                backgroundColor: null
            });
            const link = document.createElement('a');
            link.download = `${formData.recipientName}-شهادة_تقدير.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('✅ تم تحميل الصورة بنجاح وتصحيح الألوان المتداخلة!');
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4500);
        }

        window.addEventListener('DOMContentLoaded', () => { initApp(); });
  </script>
 </body>
</html>

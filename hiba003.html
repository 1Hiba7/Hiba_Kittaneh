        }
        
        .certificate {

            transition: transform 0.3s ease-out;
            will-change: transform;
        }
        
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100%) rotate(720deg);
                opacity: 0.5;
            }
        }
        
        .ornament-corner {
            position: absolute;
            width: 80px;
            height: 80px;
        }
        
        .ornament-top-right {
            top: -10px;
            right: -10px;
        }
        
        .ornament-top-left {
            top: -10px;
            left: -10px;
            transform: scaleX(-1);
        }
        
        .ornament-bottom-right {
            bottom: -10px;
            right: -10px;
            transform: scaleY(-1);
        }
        
        .ornament-bottom-left {
            bottom: -10px;
            left: -10px;
            transform: scale(-1);
        }
        
        .gold-text {
            background: linear-gradient(135deg, #C9A961 0%, #F4E4BA 25%, #D4AF37 50%, #F4E4BA 75%, #C9A961 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite;
            background-size: 200% 100%;
        }
        
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .seal {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 100px;
            height: 100px;
            animation: sealPulse 2s ease-in-out infinite;
        }
        
        @keyframes sealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .ribbon {
            position: absolute;
            top: 50%;
            right: -30px;
            width: 60px;
            height: 200px;

            transform: translateY(-50%) rotateZ(15deg);

        .burst-confetti {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: burstFade 1.5s ease-out forwards;

        @keyframes burstFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.5);
            }
        }
        
        .input-field {
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(201, 169, 97, 0.3);
        }
        
        .save-button {
            position: relative;
            overflow: hidden;
        }
        
        .save-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .save-button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10000;
            animation: slideIn 0.5s ease-out;
            font-weight: 600;
        }

            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .loading-spinner {

            left: 50%;

            z-index: 9999;
            animation: slideDown 0.3s ease-out;

        }
        
        @keyframes slideDown {
            from {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        // Save state for undo

            const state = {

                senderName: document.getElementById('senderName')?.value || formData.senderName,

            };
            
            undoStack.push(state);
            if (undoStack.length > maxUndoStack) {
                undoStack.shift();
            }
            redoStack = [];
            updateUndoRedoButtons();
        }
        
        // Undo action
        function undo() {
            if (undoStack.length === 0) return;
            
            const currentState = {
                recipientName: document.getElementById('recipientName')?.value || formData.recipientName,
                message: document.getElementById('message')?.value || formData.message,
                senderName: document.getElementById('senderName')?.value || formData.senderName,
                gender: document.querySelector('input[name="gender"]:checked')?.value || formData.gender,
                certificateType: document.getElementById('certificateType')?.value || formData.certificateType,
                selectedTheme: selectedTheme,
                customColors: customColors ? {...customColors} : null,
                certificateSize: certificateSize,
                certificateVisibility: certificateVisibility
            };
            
            redoStack.push(currentState);
            const previousState = undoStack.pop();
            applyState(previousState);
            showToast('↩️ تم التراجع');
        }
        
        // Redo action
        function redo() {
            if (redoStack.length === 0) return;
            
            const currentState = {
                recipientName: document.getElementById('recipientName')?.value || formData.recipientName,
                message: document.getElementById('message')?.value || formData.message,
                senderName: document.getElementById('senderName')?.value || formData.senderName,
                gender: document.querySelector('input[name="gender"]:checked')?.value || formData.gender,
                certificateType: document.getElementById('certificateType')?.value || formData.certificateType,
                selectedTheme: selectedTheme,
                customColors: customColors ? {...customColors} : null,
                certificateSize: certificateSize,
                certificateVisibility: certificateVisibility
            };
            
            undoStack.push(currentState);
            const nextState = redoStack.pop();
            applyState(nextState);
            showToast('↪️ تمت الإعادة');
        }
        
        // Apply state
        function applyState(state) {
            formData = {
                recipientName: state.recipientName,

                senderName: state.senderName,
                gender: state.gender,
                certificateType: state.certificateType
            };
            
            selectedTheme = state.selectedTheme;
            customColors = state.customColors ? {...state.customColors} : null;
            certificateSize = state.certificateSize;
            certificateVisibility = state.certificateVisibility;
            
            if (document.getElementById('recipientName')) {
                document.getElementById('recipientName').value = state.recipientName;
                document.getElementById('message').value = state.message;
                document.getElementById('senderName').value = state.senderName;
                document.getElementById('certificateType').value = state.certificateType;
                
                const genderRadio = document.querySelector(`input[name="gender"][value="${state.gender}"]`);
                if (genderRadio) genderRadio.checked = true;
                
                updateCertificatePreview();
                updateUndoRedoButtons();

        // Update character counters
        function updateCharCounters() {
            const recipientName = document.getElementById('recipientName')?.value || '';
            const message = document.getElementById('message')?.value || '';
            const senderName = document.getElementById('senderName')?.value || '';
            
            const recipientCounter = document.getElementById('recipientCounter');
            const messageCounter = document.getElementById('messageCounter');
            const senderCounter = document.getElementById('senderCounter');
            
            if (recipientCounter) {
                const recipientLength = recipientName.length;
                recipientCounter.textContent = `${recipientLength}/15 حرف`;
                recipientCounter.classList.remove('warning', 'danger');
                
                if (recipientLength >= 15) {
                    recipientCounter.classList.add('danger');
                } else if (recipientLength >= 13) {
                    recipientCounter.classList.add('warning');
                }
            }
            
            if (messageCounter) {
                const messageLength = message.length;
                messageCounter.textContent = `${messageLength}/70 حرف`;
                messageCounter.classList.remove('warning', 'danger');
                
                if (messageLength >= 70) {
                    messageCounter.classList.add('danger');
                } else if (messageLength >= 65) {
                    messageCounter.classList.add('warning');
                }
            }
            
            if (senderCounter) {
                const senderLength = senderName.length;
                senderCounter.textContent = `${senderLength}/15 حرف`;
                senderCounter.classList.remove('warning', 'danger');
                
                if (senderLength >= 15) {
                    senderCounter.classList.add('danger');
                } else if (senderLength >= 13) {
                    senderCounter.classList.add('warning');
                }
            }

        // Create burst confetti effect
        function createBurstConfetti() {
            const colors = ['#FFD700', '#FFA500', '#FF6B6B', '#4ECDC4', '#95E1D3', '#F38181', '#AA96DA', '#FCBAD3'];
            const container = document.getElementById('app');
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'burst-confetti';
                confetti.style.width = '12px';
                confetti.style.height = '12px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.left = '50%';
                confetti.style.top = '50%';
                
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                confetti.style.setProperty('--tx', tx + 'px');
                confetti.style.setProperty('--ty', ty + 'px');
                
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 1500);

        // Hash password
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        // Save certificate as new

            if (senderName.length > 15) {

            if (currentRecords.length >= 999) {

            isLoading = true;
            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';
            saveBtn.disabled = true;
            
            const certificateId = 'cert_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const colors = customColors || certificateTemplates[selectedTheme].colors;
            
            const result = await window.dataSdk.create({
                type: 'certificate',
                user_id: currentUser.user_id,
                certificate_id: certificateId,
                recipient_name: recipientName,
                message: message,
                sender_name: senderName,
                gender: gender,
                certificate_type: certificateType,
                color_theme: selectedTheme,
                custom_colors: JSON.stringify(colors),
                visibility: certificateVisibility,
                certificate_size: certificateSize,
                is_favorite: 'false',
                template_name: selectedTemplate || selectedTheme,
                created_at: new Date().toISOString(),
                username: '',
                password: ''

            isLoading = false;
            saveBtn.innerHTML = originalText;

                message: message,
                sender_name: senderName,
                gender: gender,
                certificate_type: certificateType,

                custom_colors: JSON.stringify(colors),
                visibility: certificateVisibility,
                certificate_size: certificateSize,
                template_name: selectedTemplate || selectedTheme
            };
            
            const result = await window.dataSdk.update(updatedCert);

        // 3D tilt effect
        function handleTilt(e, element) {
            const rect = element.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            
            element.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        }
        
        function resetTilt(element) {
            element.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
        }
        
        // Update certificate preview
        function updateCertificatePreview() {
            const recipientName = document.getElementById('recipientName')?.value.trim() || formData.recipientName;
            const message = document.getElementById('message')?.value.trim() || formData.message;
            const senderName = document.getElementById('senderName')?.value.trim() || formData.senderName;
            const gender = document.querySelector('input[name="gender"]:checked')?.value || formData.gender;
            const certificateType = document.getElementById('certificateType')?.value || formData.certificateType;
            
            const previewRecipient = document.getElementById('previewRecipient');
            const previewMessage = document.getElementById('previewMessage');
            const previewSender = document.getElementById('previewSender');
            const previewGender = document.getElementById('previewGender');
            const previewType = document.getElementById('previewType');
            
            if (previewRecipient) {
                previewRecipient.textContent = recipientName || '_______________';
            }
            if (previewMessage) {
                previewMessage.textContent = message || '_______________________________________________';
            }
            if (previewSender) {
                previewSender.textContent = senderName || '_______________';
            }
            if (previewGender) {
                previewGender.textContent = gender === 'male' ? 'السيد' : 'السيدة';
            }
            if (previewType) {
                const types = {
                    appreciation: 'تقدير وعرفان',
                    thanks: 'شكر وامتنان',
                    excellence: 'تميز وإبداع',
                    achievement: 'إنجاز متميز',
                    participation: 'مشاركة فعالة'
                };
                previewType.textContent = types[certificateType] || 'تقدير وعرفان';
            }
            
            const colors = customColors || certificateTemplates[selectedTheme].colors;
            const certificate = document.getElementById('certificate');
            if (certificate) {
                certificate.style.background = colors.certificate_bg;
                certificate.style.borderColor = colors.gold_color;
                
                const sizeStyles = {
                    small: { maxWidth: '500px', padding: '30px', fontSize: '0.85' },
                    medium: { maxWidth: '700px', padding: '48px', fontSize: '1' },
                    large: { maxWidth: '900px', padding: '64px', fontSize: '1.15' }
                };
                
                const size = sizeStyles[certificateSize] || sizeStyles.medium;
                certificate.style.maxWidth = size.maxWidth;
                certificate.style.padding = size.padding;
                
                const scalablElements = certificate.querySelectorAll('.scalable-text');
                scalablElements.forEach(el => {
                    const baseSize = parseFloat(el.getAttribute('data-base-size') || '16');
                    el.style.fontSize = (baseSize * parseFloat(size.fontSize)) + 'px';
                });
                
                const goldElements = certificate.querySelectorAll('.preview-gold');
                goldElements.forEach(el => el.style.color = colors.gold_color);
                
                const textElements = certificate.querySelectorAll('.preview-text');
                textElements.forEach(el => el.style.color = colors.text_color);
                
                // Fix border lines color
                const borderLines = certificate.querySelectorAll('.border-line');
                borderLines.forEach(el => el.style.backgroundColor = colors.text_color);
                
                const ornaments = certificate.querySelectorAll('.ornament-corner path');
                ornaments.forEach(el => el.setAttribute('fill', colors.gold_color));
                
                const circles = certificate.querySelectorAll('.ornament-corner circle');
                circles.forEach(el => el.setAttribute('fill', colors.accent_color));
                
                const seal = certificate.querySelector('.seal');
                if (seal) {
                    seal.querySelector('circle:first-child').setAttribute('fill', colors.gold_color);
                    seal.querySelector('circle:nth-child(2)').setAttribute('fill', colors.accent_color);
                    seal.querySelector('path').setAttribute('fill', colors.gold_color);
                    seal.querySelector('circle:last-child').setAttribute('stroke', colors.gold_color);
                }
                
                const ribbon = certificate.querySelector('.ribbon');
                if (ribbon) {
                    ribbon.style.background = `linear-gradient(135deg, ${colors.gold_color}, ${colors.accent_color})`;
                }
            }
            
            const visibilityIndicator = document.getElementById('visibilityIndicator');
            if (visibilityIndicator) {
                visibilityIndicator.textContent = certificateVisibility === 'private' ? '🔒 خاص' : '🌐 عام';
            }
            
            const sizeButtons = document.querySelectorAll('.size-selector');
            sizeButtons.forEach(btn => {
                if (btn.dataset.size === certificateSize) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const visibilityButtons = document.querySelectorAll('.visibility-toggle');
            visibilityButtons.forEach(btn => {
                if (btn.dataset.visibility === certificateVisibility) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

                                    oninput="saveState(); updateCertificatePreview(); updateCharCounters();"

                                <div id="senderCounter" class="char-counter text-xs mt-1" style="color: ${textColor};">

                            <div class="mb-6">

                                <div class="flex gap-3">
                                    <button 
                                        onclick="setCertificateSize('small')"
                                        data-size="small"
                                        class="size-selector flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all ${certificateSize === 'small' ? 'active' : ''}"
                                        style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    >
                                        صغير 📄
                                    </button>
                                    <button 
                                        onclick="setCertificateSize('medium')"
                                        data-size="medium"
                                        class="size-selector flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all ${certificateSize === 'medium' ? 'active' : ''}"
                                        style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    >
                                        متوسط 📃
                                    </button>
                                    <button 
                                        onclick="setCertificateSize('large')"
                                        data-size="large"
                                        class="size-selector flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all ${certificateSize === 'large' ? 'active' : ''}"
                                        style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"

                                        كبير 📜
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Certificate Visibility -->
                            <div class="mb-6">
                                <label class="block mb-3 font-semibold" style="font-size: ${baseSize}px; color: ${textColor};">
                                    مستوى العرض <span id="visibilityIndicator">${certificateVisibility === 'private' ? '🔒 خاص' : '🌐 عام'}</span>
                                </label>
                                <div class="flex gap-3">
                                    <button 
                                        onclick="setCertificateVisibility('private')"
                                        data-visibility="private"
                                        class="visibility-toggle flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all ${certificateVisibility === 'private' ? 'active' : ''}"
                                        style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    >
                                        🔒 خاص
                                    </button>
                                    <button 
                                        onclick="setCertificateVisibility('public')"
                                        data-visibility="public"
                                        class="visibility-toggle flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all ${certificateVisibility === 'public' ? 'active' : ''}"
                                        style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    >
                                        🌐 عام
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Undo/Redo Buttons -->
                            <div class="mb-6 flex gap-3">

                                    id="undoBtn"

                                    style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    disabled
                                >
                                    ↩️ تراجع
                                </button>
                                <button 
                                    id="redoBtn"
                                    onclick="redo()"
                                    class="undo-redo-btn flex-1 py-3 px-4 rounded-xl border-2 hover:shadow-lg transition-all"
                                    style="border-color: #C9A961; font-size: ${baseSize * 0.9}px;"
                                    disabled
                                >
                                    ↪️ إعادة
                                </button>

                            <!-- Color Templates (20 templates) -->
                            <div class="mb-6">
                                <label class="block mb-3 font-semibold" style="font-size: ${baseSize}px; color: ${textColor};">

                                </label>
                                <div class="grid grid-cols-5 gap-2 mb-4">
                                    ${Object.entries(certificateTemplates).map(([key, theme]) => `
                                        <button 
                                            onclick="applyColorTheme('${key}')"
                                            class="template-card p-2 rounded-lg ${selectedTheme === key && !customColors ? 'selected' : ''}"
                                            style="background: linear-gradient(135deg, ${theme.colors.gold_color}, ${theme.colors.accent_color});"
                                            title="${theme.name}"
                                        >
                                            <div class="text-2xl">${theme.emoji}</div>
                                            <div class="text-xs text-white mt-1">${theme.name}</div>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Custom Colors -->
                            <div class="mb-6">
                                <label class="block mb-3 font-semibold" style="font-size: ${baseSize}px; color: ${textColor};">
                                    تخصيص الألوان 🎨
                                </label>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label style="font-size: ${baseSize * 0.9}px; color: ${textColor};">لون الخلفية</label>
                                        <input 
                                            type="color" 
                                            value="${colors.certificate_bg}"
                                            onchange="applyCustomColor('certificate_bg', this.value)"
                                            class="w-full h-12 rounded-lg cursor-pointer"
                                        />
                                    </div>
                                    <div>
                                        <label style="font-size: ${baseSize * 0.9}px; color: ${textColor};">اللون الذهبي</label>
                                        <input 
                                            type="color" 
                                            value="${colors.gold_color}"
                                            onchange="applyCustomColor('gold_color', this.value)"
                                            class="w-full h-12 rounded-lg cursor-pointer"
                                        />
                                    </div>
                                    <div>
                                        <label style="font-size: ${baseSize * 0.9}px; color: ${textColor};">لون النص</label>
                                        <input 
                                            type="color" 
                                            value="${colors.text_color}"
                                            onchange="applyCustomColor('text_color', this.value)"
                                            class="w-full h-12 rounded-lg cursor-pointer"
                                        />
                                    </div>
                                    <div>
                                        <label style="font-size: ${baseSize * 0.9}px; color: ${textColor};">اللون المساعد</label>
                                        <input 
                                            type="color" 
                                            value="${colors.accent_color}"
                                            onchange="applyCustomColor('accent_color', this.value)"
                                            class="w-full h-12 rounded-lg cursor-pointer"
                                        />
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <button 
                                id="saveBtn"
                                onclick="saveCertificate()"
                                class="save-button w-full py-4 rounded-xl text-white font-bold shadow-lg hover:shadow-2xl transition-all transform hover:scale-105 mb-3"
                                style="background: linear-gradient(135deg, #D4AF37, #C9A961); font-size: ${baseSize * 1.2}px;"
                            >
                                ${editingCertificate ? '💾 حفظ التغييرات' : config.button_text || defaultConfig.button_text} 🎊
                            </button>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <button 
                                    onclick="downloadCertificate()"
                                    class="py-3 rounded-xl bg-green-500 text-white font-bold hover:bg-green-600 transition-all"
                                    style="font-size: ${baseSize}px;"
                                >
                                    📥 تحميل كصورة
                                </button>
                                <button 
                                    onclick="showFullscreenPreview()"
                                    class="py-3 rounded-xl bg-blue-500 text-white font-bold hover:bg-blue-600 transition-all"
                                    style="font-size: ${baseSize}px;"
                                >
                                    🔍 معاينة كاملة
                                </button>
                            </div>
                            
                            ${editingCertificate ? `
                                <button 
                                    onclick="editingCertificate = null; currentView = 'gallery'; render();"
                                    class="w-full py-3 mt-3 rounded-xl border-2 border-gray-300 hover:bg-gray-50 transition-all"
                                    style="font-size: ${baseSize}px;"
                                >
                                    إلغاء التعديل
                                </button>
                            ` : ''}
                        </div>
                        
                        <!-- Certificate Preview -->
                        <div class="certificate-container">
                            <div 
                                id="certificate"
                                class="certificate relative bg-white rounded-2xl shadow-2xl p-12 mx-auto"
                                style="background: ${colors.certificate_bg}; border: 8px solid ${colors.gold_color};"
                                onmousemove="handleTilt(event, this)"
                                onmouseleave="resetTilt(this)"
                            >
                                <!-- Ornamental Corners -->
                                <svg class="ornament-corner ornament-top-right" viewBox="0 0 100 100">
                                    <path d="M0,0 L100,0 L100,100 Q50,50 0,0 Z" fill="${colors.gold_color}" opacity="0.3"/>
                                    <circle cx="85" cy="15" r="8" fill="${colors.accent_color}"/>
                                    <circle cx="15" cy="85" r="6" fill="${colors.accent_color}"/>
                                </svg>
                                
                                <svg class="ornament-corner ornament-top-left" viewBox="0 0 100 100">
                                    <path d="M0,0 L100,0 L100,100 Q50,50 0,0 Z" fill="${colors.gold_color}" opacity="0.3"/>
                                    <circle cx="85" cy="15" r="8" fill="${colors.accent_color}"/>
                                    <circle cx="15" cy="85" r="6" fill="${colors.accent_color}"/>
                                </svg>
                                
                                <svg class="ornament-corner ornament-bottom-right" viewBox="0 0 100 100">
                                    <path d="M0,0 L100,0 L100,100 Q50,50 0,0 Z" fill="${colors.gold_color}" opacity="0.3"/>
                                    <circle cx="85" cy="15" r="8" fill="${colors.accent_color}"/>
                                    <circle cx="15" cy="85" r="6" fill="${colors.accent_color}"/>
                                </svg>
                                
                                <svg class="ornament-corner ornament-bottom-left" viewBox="0 0 100 100">
                                    <path d="M0,0 L100,0 L100,100 Q50,50 0,0 Z" fill="${colors.gold_color}" opacity="0.3"/>
                                    <circle cx="85" cy="15" r="8" fill="${colors.accent_color}"/>
                                    <circle cx="15" cy="85" r="6" fill="${colors.accent_color}"/>
                                </svg>
                                
                                <!-- Ribbon -->
                                <div class="ribbon" style="background: linear-gradient(135deg, ${colors.gold_color}, ${colors.accent_color});"></div>
                                
                                <!-- Seal -->
                                <svg class="seal" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="${colors.gold_color}" opacity="0.9"/>
                                    <circle cx="50" cy="50" r="35" fill="${colors.accent_color}"/>
                                    <path d="M50,20 L55,40 L75,40 L60,52 L65,72 L50,60 L35,72 L40,52 L25,40 L45,40 Z" fill="${colors.gold_color}"/>
                                    <circle cx="50" cy="50" r="30" fill="none" stroke="${colors.gold_color}" stroke-width="2"/>
                                </svg>
                                
                                <!-- Content -->
                                <div class="text-center relative z-10">
                                    <div class="mb-6">
                                        <div class="text-5xl mb-4">🏆</div>
                                        <h1 class="font-bold mb-2 preview-gold scalable-text" data-base-size="40" style="font-family: 'Amiri', serif; font-size: ${baseSize * 2.5}px; color: ${colors.gold_color};">
                                            شهادة <span id="previewType">تقدير وعرفان</span>
                                        </h1>
                                        <div class="w-32 h-1 mx-auto mb-4 border-line" style="background: ${colors.text_color};"></div>
                                    </div>
                                    
                                    <p class="mb-6 preview-text scalable-text" data-base-size="18" style="font-size: ${baseSize * 1.1}px; color: ${colors.text_color};">
                                        ${config.subtitle_text || defaultConfig.subtitle_text}
                                    </p>
                                    
                                    <div class="mb-6">
                                        <p class="mb-2 preview-text scalable-text" data-base-size="18" style="font-size: ${baseSize * 1.1}px; color: ${colors.text_color};">
                                            إلى <span id="previewGender">السيد</span>
                                        </p>
                                        <p id="previewRecipient" class="text-4xl font-bold mb-6 preview-gold scalable-text" data-base-size="40" style="font-family: 'Amiri', serif; font-size: ${baseSize * 2.5}px; color: ${colors.gold_color};">
                                            ${formData.recipientName}
                                        </p>
                                    </div>
                                    
                                    <div class="mb-10 px-6">
                                        <p id="previewMessage" class="leading-relaxed preview-text scalable-text" data-base-size="19" style="font-size: ${baseSize * 1.2}px; color: ${colors.text_color};">
                                            ${formData.message}
                                        </p>
                                    </div>
                                    
                                    <div class="flex justify-between items-end px-6">
                                        <div>
                                            <p class="mb-2 preview-text scalable-text" data-base-size="14" style="font-size: ${baseSize * 0.9}px; color: ${colors.text_color};">التاريخ</p>
                                            <p class="font-semibold preview-text scalable-text" data-base-size="16" style="font-size: ${baseSize}px; color: ${colors.text_color};">
                                                ${new Date().toLocaleDateString('ar-SA')}
                                            </p>
                                        </div>
                                        
                                        <div style="position: relative; z-index: 10;">
                                            <div class="w-40 h-0.5 mb-3 border-line" style="background-color: ${colors.text_color};"></div>
                                            <p id="previewSender" class="font-bold preview-gold scalable-text" data-base-size="19" style="font-size: ${baseSize * 1.2}px; color: ${colors.gold_color};">
                                                ${formData.senderName}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Render gallery view
        function renderGallery() {
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            const customFont = config.font_family || defaultConfig.font_family;
            const baseSize = config.font_size || defaultConfig.font_size;
            const textColor = isDarkMode ? '#e8e8e8' : '#78350F';
            const userCertificates = getUserCertificates().sort((a, b) => 
                new Date(b.created_at) - new Date(a.created_at)
            );
            
            const filteredCertificates = filterCertificates(userCertificates);
            
            const galleryHTML = `
                <div style="font-family: ${customFont}, Cairo, sans-serif;">
                    ${renderNavigation()}
                    
                    <div class="bg-white rounded-3xl shadow-2xl p-8 mb-6">
                        <h2 class="text-3xl font-bold text-center mb-2" style="font-size: ${baseSize * 2}px; color: #D4AF37;">
                            🖼️ ${config.gallery_title || defaultConfig.gallery_title}
                        </h2>
                        <p class="text-center mb-6" style="font-size: ${baseSize}px; color: ${textColor};">
                            لديك ${userCertificates.length} شهادة محفوظة
                        </p>
                        
                        <!-- Search and Filter -->
                        <div class="space-y-4">
                            <input 
                                type="text" 
                                placeholder="🔍 ابحث بالاسم أو الرسالة..."
                                class="search-input w-full px-4 py-3 rounded-xl border-2 focus:outline-none"
                                style="border-color: #C9A961; font-size: ${baseSize}px;"
                                oninput="searchQuery = this.value; renderGallery();"
                                value="${searchQuery}"
                            />
                            
                            <div class="flex gap-2 flex-wrap">
                                <button onclick="filterType = 'all'; renderGallery();" class="filter-chip ${filterType === 'all' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    الكل
                                </button>
                                <button onclick="filterType = 'appreciation'; renderGallery();" class="filter-chip ${filterType === 'appreciation' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    تقدير
                                </button>
                                <button onclick="filterType = 'thanks'; renderGallery();" class="filter-chip ${filterType === 'thanks' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    شكر
                                </button>
                                <button onclick="filterType = 'excellence'; renderGallery();" class="filter-chip ${filterType === 'excellence' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    تميز
                                </button>
                                <button onclick="filterType = 'achievement'; renderGallery();" class="filter-chip ${filterType === 'achievement' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    إنجاز
                                </button>
                                <button onclick="filterType = 'participation'; renderGallery();" class="filter-chip ${filterType === 'participation' ? 'active' : ''}" style="font-size: ${baseSize * 0.9}px;">
                                    مشاركة
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    ${filteredCertificates.length === 0 ? `
                        <div class="text-center py-20">
                            <div class="text-8xl mb-6">📭</div>
                            <h3 class="text-2xl font-bold mb-3" style="color: ${textColor};">لا توجد شهادات</h3>
                            <p class="mb-6" style="font-size: ${baseSize}px; color: ${textColor};">
                                ${searchQuery || filterType !== 'all' ? 'لا توجد نتائج للبحث' : 'ابدأ بإنشاء أول شهادة لك!'}
                            </p>
                            ${!searchQuery && filterType === 'all' ? `
                                <button 
                                    onclick="currentView = 'create'; render();"
                                    class="px-8 py-4 rounded-xl text-white font-bold shadow-lg hover:shadow-2xl transition-all transform hover:scale-105"
                                    style="background: linear-gradient(135deg, #D4AF37, #C9A961); font-size: ${baseSize * 1.1}px;"
                                >
                                    إنشاء شهادة جديدة 🎨
                                </button>
                            ` : ''}
                        </div>
                    ` : `
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${filteredCertificates.map(cert => {
                                const colors = cert.custom_colors ? JSON.parse(cert.custom_colors) : certificateTemplates[cert.color_theme].colors;
                                const types = {
                                    appreciation: 'تقدير وعرفان',
                                    thanks: 'شكر وامتنان',
                                    excellence: 'تميز وإبداع',
                                    achievement: 'إنجاز متميز',
                                    participation: 'مشاركة فعالة'
                                };
                                const visibility = cert.visibility || 'private';
                                const isFavorite = cert.is_favorite === 'true';
                                
                                return `
                                    <div class="gallery-card certificate-card bg-white rounded-2xl shadow-lg overflow-hidden" style="border: 3px solid ${colors.gold_color};">
                                        <div class="certificate-preview p-6 relative" style="background: ${colors.certificate_bg};">
                                            <div class="absolute top-2 right-2 flex gap-2">
                                                ${visibility === 'public' ? '<div class="text-2xl">🌐</div>' : '<div class="text-2xl">🔒</div>'}
                                                <div 
                                                    class="favorite-star"
                                                    onclick='toggleFavorite(${JSON.stringify(cert).replace(/'/g, "\\'")});'
                                                >
                                                    ${isFavorite ? '⭐' : '☆'}
                                                </div>
                                            </div>
                                            <div class="text-4xl text-center mb-3">🏆</div>
                                            <h3 class="text-xl font-bold text-center mb-2" style="color: ${colors.gold_color}; font-size: ${baseSize * 1.3}px;">
                                                ${types[cert.certificate_type]}
                                            </h3>
                                            <p class="text-center mb-2 font-bold" style="color: ${colors.text_color}; font-size: ${baseSize * 1.1}px;">
                                                ${cert.recipient_name}
                                            </p>
                                            <p class="text-center text-sm mb-3 line-clamp-2" style="color: ${colors.text_color}; font-size: ${baseSize * 0.9}px;">
                                                ${cert.message}
                                            </p>
                                            <p class="text-center text-xs" style="color: ${colors.text_color}; font-size: ${baseSize * 0.8}px;">
                                                من: ${cert.sender_name}
                                            </p>
                                            <p class="text-center text-xs mt-2" style="color: ${colors.text_color}; font-size: ${baseSize * 0.75}px;">
                                                ${new Date(cert.created_at).toLocaleDateString('ar-SA')}
                                            </p>
                                        </div>
                                        <div class="p-4 bg-gray-50">
                                            <div class="flex gap-2 mb-2">
                                                <button 
                                                    onclick='editCertificate(${JSON.stringify(cert).replace(/'/g, "\\'")});'
                                                    class="flex-1 py-2 px-4 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all transform hover:scale-105"
                                                    style="font-size: ${baseSize * 0.9}px;"
                                                >
                                                    ✏️ تعديل
                                                </button>
                                                ${certificateToDelete === cert.certificate_id ? `
                                                    <button 
                                                        onclick='deleteCertificate(${JSON.stringify(cert).replace(/'/g, "\\'")});'
                                                        class="flex-1 py-2 px-4 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-all delete-confirm"
                                                        style="font-size: ${baseSize * 0.9}px;"
                                                    >
                                                        ⚠️ تأكيد الحذف
                                                    </button>

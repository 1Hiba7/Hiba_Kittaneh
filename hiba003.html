<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة شهادات التقدير التفاعلية | هبة كتانة</title>
  <link rel="icon" type="image/png" href="3.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
        body {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap');
        
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .certificate-container { perspective: 1500px; }
        .gold-text {
            background: linear-gradient(135deg, #C9A961 0%, #F4E4BA 25%, #D4AF37 50%, #F4E4BA 75%, #C9A961 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10000;
        }
        .loading-spinner {
            border: 3px solid rgba(201, 169, 97, 0.3);
            border-top: 3px solid #C9A961;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
 </head>
 <body class="h-full bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">

  <div id="app" class="w-full h-full overflow-auto p-4 md:p-8">
      </div>

  <script>
        // --- إعدادات الاتصال بـ Supabase ---
        // استبدلي هذه القيم بالقيم الخاصة بمشروع الشهادات الجديد في حسابكِ
        const SUPABASE_URL = "https://lxyyrdhvcaqqdvuucnua.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Y-_Th8vqG4IWIg2JouB5cg_cvzL2vA6";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // حالة التطبيق العامة
        let currentUser = null;
        let currentView = 'login'; // الإطلالات المتاحة: login, register, dashboard, gallery
        let currentRecords = [];
        let isLoading = false;

        // بيانات النموذج الافتراضية لإنشاء الشهادة
        let formData = {
            recipientName: 'الطالب المتميز',
            message: 'لقد بذلت جهداً كبيراً هذا العام فهنيئاً لك وشكراً لك على كل ما قدمته',
            senderName: 'إدارة المدرسة الشرعية',
            certificateType: 'appreciation'
        };

        // دالة بدء تشغيل التطبيق وفحص الجلسة الحالية
        async function initApp() {
            showLoading(true);
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                currentView = 'dashboard';
                await loadUserCertificates();
            } else {
                currentView = 'login';
            }
            showLoading(false);
            renderApp();
        }

        // رندر الواجهة بناءً على الصفحة الحالية
        function renderApp() {
            const app = document.getElementById('app');
            
            if (currentView === 'login') {
                app.innerHTML = renderLoginView();
            } else if (currentView === 'register') {
                app.innerHTML = renderRegisterView();
            } else if (currentView === 'dashboard') {
                app.innerHTML = renderDashboardView();
            } else if (currentView === 'gallery') {
                app.innerHTML = renderGalleryView();
            }
        }

        // واجهة تسجيل الدخول
        function renderLoginView() {
            return `
            <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-amber-200">
                <h2 class="text-2xl font-bold text-center text-amber-800 mb-6">مرحباً بك في منصة الشهادات التفاعلية</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="login-email" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="name@domain.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="login-password" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••">
                    </div>
                    <button onclick="handleLogin()" class="w-full py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 transition">تسجيل الدخول</button>
                    <p class="text-center text-sm text-gray-600 mt-4">ليس لديك حساب؟ <span onclick="switchView('register')" class="text-amber-600 cursor-pointer underline">أنشئ حساباً جديداً</span></p>
                </div>
            </div>`;
        }

        // واجهة إنشاء حساب جديد
        function renderRegisterView() {
            return `
            <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-amber-200">
                <h2 class="text-2xl font-bold text-center text-amber-800 mb-6">إنشاء حساب جديد</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="reg-email" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" id="reg-password" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="لا تقل عن 6 خانات">
                    </div>
                    <button onclick="handleRegister()" class="w-full py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition">تسجيل حساب جديد</button>
                    <p class="text-center text-sm text-gray-600 mt-4">لديك حساب بالفعل؟ <span onclick="switchView('login')" class="text-amber-600 cursor-pointer underline">تسجيل الدخول</span></p>
                </div>
            </div>`;
        }

        // واجهة لوحة التحكم وتصميم الشهادة
        function renderDashboardView() {
            return `
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-8">
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-amber-900">مرحباً: ${currentUser.email}</span>
                        <button onclick="switchView('gallery')" class="px-4 py-2 bg-amber-100 text-amber-800 rounded-xl font-semibold hover:bg-amber-200">📂 معرض شهاداتي</button>
                    </div>
                    <button onclick="handleLogout()" class="px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold hover:bg-red-200">تسجيل الخروج</button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-lg space-y-4">
                        <h3 class="text-xl font-bold text-gray-800 border-b pb-2">أدخل بيانات الشهادة</h3>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستلم (الطالب/ة)</label>
                            <input type="text" id="recipientName" value="${formData.recipientName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نص التقدير والثناء</label>
                            <textarea id="message" rows="3" oninput="updatePreview()" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-amber-500">${formData.message}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المعلم/ة أو الجهة المصدرة</label>
                            <input type="text" id="senderName" value="${formData.senderName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نوع الشهادة</label>
                            <select id="certificateType" onchange="updatePreview()" class="w-full p-3 border rounded-xl">
                                <option value="appreciation" ${formData.certificateType === 'appreciation' ? 'selected' : ''}>شهادة تقدير وعرفان</option>
                                <option value="excellence" ${formData.certificateType === 'excellence' ? 'selected' : ''}>شهادة تفوق وتميز</option>
                                <option value="thanks" ${formData.certificateType === 'thanks' ? 'selected' : ''}>شهادة شكر وامتنان</option>
                            </select>
                        </div>
                        <div class="pt-4 flex gap-4">
                            <button onclick="saveCertificateToSupabase()" class="flex-1 py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 shadow-md">💾 حفظ سحابياً</button>
                            <button onclick="downloadCertificateAsPNG()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 shadow-md">🖼️ تحميل كصورة</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-center">
                        <div id="certificate-capture-area" class="w-full max-w-lg bg-amber-50 border-8 border-amber-300 p-8 rounded-xl shadow-2xl relative text-center min-h-[400px] flex flex-col justify-between">
                            <div class="text-amber-700 font-bold text-lg tracking-widest border-b border-amber-200 pb-2 mb-4" id="view-cert-title">شهادة تقدير وعرفان</div>
                            <div class="my-auto space-y-4">
                                <p class="text-gray-600 text-sm">تتقدم إدارة المدرسة بالامتنان والتقدير لـ</p>
                                <h2 class="text-3xl font-bold text-amber-800 arabic-title gold-text" id="view-recipient">${formData.recipientName}</h2>
                                <p class="text-gray-700 leading-relaxed px-4 text-sm" id="view-message">${formData.message}</p>
                            </div>
                            <div class="flex justify-between items-center mt-6 pt-4 border-t border-amber-200 text-sm">
                                <div class="text-right text-gray-600">التاريخ: ${new Date().toLocaleDateString('ar-EG')}</div>
                                <div class="text-left font-bold text-amber-900" id="view-sender">${formData.senderName}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // واجهة المعرض السحابي
        function renderGalleryView() {
            let recordsHTML = '';
            if (currentRecords.length === 0) {
                recordsHTML = '<p class="col-span-full text-center text-gray-500 py-12">لم تقم بحفظ أي شهادات سحابياً حتى الآن.</p>';
            } else {
                currentRecords.forEach(cert => {
                    recordsHTML += `
                    <div class="bg-amber-50 p-6 rounded-xl shadow border border-amber-200 flex flex-col justify-between">
                        <div>
                            <span class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded font-bold">${cert.certificate_type === 'excellence' ? 'تفوق' : 'تقدير'}</span>
                            <h4 class="text-lg font-bold text-amber-900 mt-2">${cert.recipient_name}</h4>
                            <p class="text-gray-700 text-xs my-2 line-clamp-2">${cert.message}</p>
                            <small class="text-gray-400">بواسطة: ${cert.sender_name}</small>
                        </div>
                        <button onclick="deleteCertificate('${cert.id}')" class="mt-4 w-full py-1.5 bg-red-100 text-red-700 text-sm font-semibold rounded-lg hover:bg-red-200 transition">🗑️ حذف من السحابة</button>
                    </div>`;
                });
            }

            return `
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-amber-900">📂 معرض شهاداتي السحابي</h2>
                    <button onclick="switchView('dashboard')" class="px-4 py-2 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700">➕ تصميم شهادة جديدة</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${recordsHTML}
                </div>
            </div>`;
        }

        // --- العمليات والتحكم بالفروع والبيانات ---

        function switchView(view) {
            currentView = view;
            renderApp();
        }

        function updatePreview() {
                formData.recipientName = document.getElementById('recipientName').value;
                formData.message = document.getElementById('message').value;
                formData.senderName = document.getElementById('senderName').value;
                formData.certificateType = document.getElementById('certificateType').value;

                // تحديث العرض الحي
                document.getElementById('view-recipient').textContent = formData.recipientName;
                document.getElementById('view-message').textContent = formData.message;
                document.getElementById('view-sender').textContent = formData.senderName;
    
                const typeLabels = { appreciation: 'شهادة تقدير وعرفان', excellence: 'شهادة تفوق وتميز', thanks: 'شهادة شكر وامتنان' };
                // تم التصحيح هنا إلى view-cert-title ليطابق الـ HTML
                document.getElementById('view-cert-title').textContent = typeLabels[formData.certificateType] || 'شهادة تقدير';
            }

        // تسجيل حساب جديد في السحابة
        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            if (!email || !password) return showToast('⚠️ يرجى ملء كافة الحقول');

            showLoading(true);
            const { data, error } = await supabase.auth.signUp({ email, password });
            showLoading(false);

            if (error) {
                showToast('❌ خطأ: ' + error.message);
            } else {
                showToast('🎉 تم إنشاء الحساب بنجاح! تفقد بريدك للتفعيل إذا تطلب الأمر.');
                switchView('login');
            }
        }

        // تسجيل الدخول
        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) return showToast('⚠️ يرجى إدخال البريد وكلمة المرور');

            showLoading(true);
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            showLoading(false);

            if (error) {
                showToast('❌ فشل تسجيل الدخول: ' + error.message);
            } else {
                currentUser = data.user;
                showToast('👋 مرحباً بك مجدداً!');
                currentView = 'dashboard';
                await loadUserCertificates();
                renderApp();
            }
        }

        // تسجيل الخروج
        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            currentRecords = [];
            currentView = 'login';
            renderApp();
        }

        // حفظ الشهادة في جدول Supabase
        async function saveCertificateToSupabase() {
            if (!currentUser) return showToast('⚠️ يجب تسجيل الدخول أولاً');
            
            showLoading(true);
            const { data, error } = await supabase.from('certificates').insert([
                {
                    user_id: currentUser.id,
                    recipient_name: formData.recipientName,
                    message: formData.message,
                    sender_name: formData.senderName,
                    certificate_type: formData.certificateType,
                    created_at: new Date()
                }
            ]);
            showLoading(false);

            if (error) {
                showToast('❌ خطأ أثناء الحفظ السحابي: ' + error.message);
            } else {
                showToast('💾 تم حفظ الشهادة في قاعدة البيانات السحابية بنجاح!');
                await loadUserCertificates();
            }
        }

        // جلب الشهادات المخزنة للمستخدم الحالي
        async function loadUserCertificates() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('certificates')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (!error && data) {
                currentRecords = data;
            }
        }

        // حذف شهادة من السحابة
        async function deleteCertificate(id) {
            showLoading(true);
            const { error } = await supabase.from('certificates').delete().eq('id', id);
            showLoading(false);

            if (error) {
                showToast('❌ لم يتم الحذف: ' + error.message);
            } else {
                showToast('🗑️ تم الحذف بنجاح من السحابة');
                await loadUserCertificates();
                renderApp();
            }
        }

        // تحميل كصورة PNG عبر المتصفح
        async function downloadCertificateAsPNG() {
            const area = document.getElementById('certificate-capture-area');
            if (!area) return;
            showToast('⏳ جاري إنشاء ملف الصورة الخاص بك...');
            
            const canvas = await html2canvas(area, { scale: 2, useCORS: true });
            const link = document.createElement('a');
            link.download = `${formData.recipientName}-شهادة.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('✅ تم تحميل الصورة بنجاح!');
        }

        // أدوات مساعدة للـ UI
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showLoading(state) {
            isLoading = state;
            // يمكن إضافة سبينر كبير هنا إذا لزم الأمر
        }

        // بدء تشغيل التطبيق بالكامل
        initApp();
  </script>
 </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة شهادات التقدير التفاعلية | هبة كتانة</title>
  <link rel="icon" type="image/png" href="3.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap');
        
        body {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10000;
            transition: all 0.4s ease;
        }

        .draggable-image {
            position: absolute;
            cursor: move;
            touch-action: none;
            display: inline-block;
            z-index: 50;
        }
        
        .frame-none { border: none !important; padding: 0 !important; }
        .frame-circle { border-radius: 50% !important; }
        .frame-gold { border-style: double !important; border-width: 6px !important; padding: 2px; }
        .frame-royal { border-style: solid !important; border-width: 4px !important; padding: 2px; }

        .fix-arabic-render {
            letter-spacing: 0px !important;
            word-spacing: 0px !important;
            transform: translateZ(0);
        }
  </style>
 </head>
 <body class="h-full bg-gradient-to-br from-slate-50 via-amber-50 to-orange-50">

  <div id="app" class="w-full h-full overflow-auto p-4 md:p-8"></div>

  <script>
        const SUPABASE_URL = "https://lxyyrdhvcaqqdvuucnua.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Y-_Th8vqG4IWIg2JouB5cg_cvzL2vA6";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentView = 'login'; 
        let currentRecords = [];
        
        // متغيرات التحكم بـ OTP المطورة
        let isOtpSent = false; 
        let targetEmail = '';   
        let otpType = 'magiclink'; // يمكن أن تكون 'magiclink' للدخول أو 'signup' للتسجيل الجديد

        let uploadedImageSrc = '';
        let imageSize = 100;
        let imageFrameClass = 'frame-none';
        let isDragging = false;
        let startX, startY;
        let initialLeft = 50, initialTop = 50;

        let customColors = {
            bgColor: '#fdfbf7',
            borderColor: '#d4af37',
            textColor: '#85581A',
            frameColor: '#d4af37'
        };

        let formData = {
            introText: 'تتقدم إدارة المدرسة بالامتنان والتقدير لـ',
            recipientName: 'الطالب المتميز',
            message: 'لقد بذلت جهداً كبيراً هذا العام فهنيئاً لك وشكراً لك على كل ما قدمته للجنة التكنولوجية',
            senderName: 'إدارة المدرسة الشرعية',
            certificateType: 'appreciation',
            fontFamily: 'Amiri'
        };

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        async function initApp() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                currentView = 'dashboard';
                await loadUserCertificates();
            } else {
                currentView = 'login';
            }
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (currentView === 'login') app.innerHTML = renderLoginView();
            else if (currentView === 'dashboard') app.innerHTML = renderDashboardView();
            else if (currentView === 'gallery') app.innerHTML = renderGalleryView();
            
            if (currentView === 'dashboard') {
                setupDraggable();
            }
        }

        // واجهة الدخول المرنة التي تستقبل الرمز المكون من 6 أرقام
        function renderLoginView() {
            if (!isOtpSent) {
                return `
                <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-amber-200">
                    <div class="text-center mb-6">
                        <span class="text-4xl">🔐</span>
                        <h2 class="text-2xl font-bold text-amber-800 mt-2">تسجيل الدخول / إنشاء حساب</h2>
                        <p class="text-xs text-gray-500 mt-1">أدخلي بريدكِ الإلكتروني وسيتعرف النظام عليكِ فوراً بالرمز الرقمي</p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني</label>
                            <input type="email" id="login-email" value="${targetEmail}" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-left" placeholder="name@domain.com" dir="ltr">
                        </div>
                        <button onclick="sendOtpCode()" class="w-full py-3 bg-gradient-to-r from-amber-600 to-orange-600 text-white rounded-xl font-bold hover:from-amber-700 hover:to-orange-700 shadow-md transition">إرسال رمز التحقق (6 أرقام)</button>
                    </div>
                </div>`;
            } else {
                return `
                <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-emerald-200">
                    <div class="text-center mb-6">
                        <span class="text-4xl">📨</span>
                        <h2 class="text-2xl font-bold text-emerald-800 mt-2">تأكيد رمز التحقق السري</h2>
                        <p class="text-xs text-gray-500 mt-1">أدخلي الرمز المكون من 6 أرقام المرسل إلى <br><b class="text-slate-700">${targetEmail}</b></p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">أدخل الرمز هنا</label>
                            <input type="text" id="otp-code" maxlength="6" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center font-bold tracking-widest text-xl text-slate-800" placeholder="000000" dir="ltr">
                        </div>
                        <button onclick="verifyOtpCode()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl font-bold hover:from-emerald-700 hover:to-teal-700 shadow-md transition">تأكيد وولوج آمن</button>
                        <button onclick="isOtpSent = false; renderApp();" class="w-full text-xs text-center text-gray-500 hover:underline">🔄 تغيير البريد الإلكتروني</button>
                    </div>
                </div>`;
            }
        }

        function renderDashboardView() {
            return `
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-8">
                    <span class="font-bold text-amber-900 flex items-center gap-2">✨ مرحباً بكِ في نظام التصميم والتحقق الذكي المستقر</span>
                    <div class="flex gap-2">
                        <button onclick="goToGallery()" class="px-4 py-2 bg-amber-100 text-amber-800 rounded-xl font-semibold hover:bg-amber-200">📂 معرض شهاداتي السحابي</button>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold hover:bg-red-200">خروج آمن</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-lg space-y-4 lg:col-span-1 overflow-y-auto max-h-[80vh]">
                        <h3 class="text-xl font-bold text-gray-800 border-b pb-2">لوحة تخصيص الشهادة</h3>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">النص الافتتاحي للشهادة</label>
                            <input type="text" id="introText" value="${formData.introText}" oninput="updatePreview()" class="w-full p-3 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم الطالب/ة</label>
                            <input type="text" id="recipientName" value="${formData.recipientName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نص الثناء</label>
                            <textarea id="message" rows="3" oninput="updatePreview()" class="w-full p-3 border rounded-xl text-sm">${formData.message}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المعلمة أو الإدارة</label>
                            <input type="text" id="senderName" value="${formData.senderName}" oninput="updatePreview()" class="w-full p-3 border rounded-xl">
                        </div>
                        
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-3">
                            <label class="block text-xs font-bold text-amber-800">✨ إضافة شعار أو صورة للشهادة</label>
                            <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">
                            
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">حجم الصورة المرفوعة</label>
                                <input type="range" id="imageSizeSlider" min="40" max="250" value="${imageSize}" oninput="changeImageSize(this.value)" class="w-full accent-amber-600">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-600 mb-1">شكل ونوع الإطار</label>
                                <select id="imageFrameSelect" onchange="changeImageFrame(this.value)" class="w-full p-2 text-xs border rounded-lg bg-white">
                                    <option value="frame-none">بدون إطار</option>
                                    <option value="frame-circle">شكل دائري هندسي</option>
                                    <option value="frame-gold">إطار مزدوج ملكي</option>
                                    <option value="frame-royal">إطار مصمت مدرسي</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs text-gray-600 mb-1">لون إطار الصورة (HEX)</label>
                                <div class="flex gap-2 items-center">
                                    <input type="color" id="frameColorPicker" value="${customColors.frameColor}" oninput="updateCustomColors('frameColor', this.value)" class="w-10 h-8 border rounded cursor-pointer">
                                    <input type="text" id="frameColorText" value="${customColors.frameColor}" oninput="updateCustomColors('frameColor', this.value)" class="w-full p-1 text-xs border rounded-lg text-center">
                                </div>
                            </div>
                        </div>

                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                            <label class="block text-xs font-bold text-slate-800">🎨 تخصيص ألوان الشهادة بالكامل (HEX)</label>
                            <div class="grid grid-cols-3 gap-2">
                                <div class="text-center">
                                    <label class="block text-[11px] text-gray-600 mb-1">الخلفية</label>
                                    <input type="color" value="${customColors.bgColor}" oninput="updateCustomColors('bgColor', this.value)" class="w-full h-8 border rounded cursor-pointer">
                                </div>
                                <div class="text-center">
                                    <label class="block text-[11px] text-gray-600 mb-1">الإطار</label>
                                    <input type="color" value="${customColors.borderColor}" oninput="updateCustomColors('borderColor', this.value)" class="w-full h-8 border rounded cursor-pointer">
                                </div>
                                <div class="text-center">
                                    <label class="block text-[11px] text-gray-600 mb-1">النصوص</label>
                                    <input type="color" value="${customColors.textColor}" oninput="updateCustomColors('textColor', this.value)" class="w-full h-8 border rounded cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نوع الخط العربي</label>
                            <select id="certificateFont" onchange="updatePreview()" class="w-full p-3 border rounded-xl">
                                <option value="Amiri" ${formData.fontFamily === 'Amiri' ? 'selected' : ''}>خط أميري (عريق ومزخرف)</option>
                                <option value="Tajawal" ${formData.fontFamily === 'Tajawal' ? 'selected' : ''}>خط تجوال (حديث وأنيق)</option>
                                <option value="Cairo" ${formData.fontFamily === 'Cairo' ? 'selected' : ''}>خط القاهرة (هندسي وجذاب)</option>
                            </select>
                        </div>

                        <div class="pt-2 flex gap-4">
                            <button onclick="saveCertificateToSupabase()" class="flex-1 py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700 shadow-md transition text-sm">💾 حفظ في السحابة</button>
                            <button onclick="downloadCertificateAsPNG()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 shadow-md transition text-sm">🖼️ تحميل كصورة</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-center lg:col-span-2 select-none relative">
                        <div id="certificate-capture-area" class="w-full max-w-2xl border-[12px] p-12 rounded-xl shadow-2xl relative text-center min-h-[480px] flex flex-col justify-between overflow-hidden" style="font-family: 'Amiri', serif; background-color: ${customColors.bgColor}; border-color: ${customColors.borderColor}; color: ${customColors.textColor};">
                            
                            <div id="imageContainer" class="draggable-image ${imageFrameClass}" style="left: ${initialLeft}px; top: ${initialTop}px; display: ${uploadedImageSrc ? 'block' : 'none'}; border-color: ${customColors.frameColor};">
                                <img id="certCustomImage" src="${uploadedImageSrc}" style="width: ${imageSize}px; height: auto;" class="${imageFrameClass.includes('frame-circle') ? 'rounded-full' : ''}">
                            </div>

                            <div class="font-bold text-3xl tracking-widest border-b border-opacity-20 pb-3 mb-6 fix-arabic-render" id="view-cert-title" style="color: ${customColors.textColor};">شهادة تقدير وعرفان</div>
                            
                            <div class="my-auto space-y-6 z-10">
                                <p class="opacity-80 text-base fix-arabic-render" id="view-intro">${formData.introText}</p>
                                <h2 class="text-4xl font-bold fix-arabic-render" id="view-recipient" style="color: ${customColors.textColor}; text-shadow: 0px 1px 1px rgba(0,0,0,0.1);">${formData.recipientName}</h2>
                                <p class="leading-relaxed px-8 text-lg fix-arabic-render" id="view-message">${formData.message}</p>
                            </div>
                            
                            <div class="flex justify-between items-center mt-8 pt-4 border-t border-opacity-20 text-sm z-10">
                                <div class="opacity-70">التاريخ: ${new Date().toLocaleDateString('ar-EG')}</div>
                                <div class="font-bold text-lg fix-arabic-render" id="view-sender">${formData.senderName}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderGalleryView() {
            let recordsHTML = '';
            if (currentRecords.length === 0) {
                recordsHTML = '<p class="col-span-full text-center text-gray-500 py-12">لم تقم بحفظ أي شهادات سحابياً حتى الآن.</p>';
            } else {
                currentRecords.forEach(cert => {
                    const bg = cert.theme && cert.theme.startsWith('#') ? cert.theme : '#fdfbf7';
                    const txt = cert.font_family && cert.font_family.startsWith('#') ? cert.font_family : '#85581A';
                    
                    recordsHTML += `
                    <div class="p-6 rounded-xl shadow border flex flex-col justify-between" style="background-color: ${bg}; color: ${txt}; font-family: 'Amiri', sans-serif;">
                        <div>
                            <h4 class="text-lg font-bold">${cert.recipient_name || 'طالب'}</h4>
                            <p class="text-sm my-2 line-clamp-2 opacity-90">${cert.message || ''}</p>
                            <small class="opacity-70">بواسطة: ${cert.sender_name || 'الإدارة'}</small>
                        </div>
                        <button onclick="deleteCertificate('${cert.id}')" class="mt-4 w-full py-1.5 bg-red-600 bg-opacity-20 text-red-700 text-sm font-semibold rounded-lg hover:bg-opacity-30 transition">🗑️ حذف سحابياً</button>
                    </div>`;
                });
            }

            return `
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-amber-900">📂 معرض شهاداتي السحابي المميز</h2>
                    <button onclick="switchView('dashboard')" class="px-4 py-2 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700">➕ صمم شهادة جديدة</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${recordsHTML}
                </div>
            </div>`;
        }

        function updateCustomColors(key, value) {
            customColors[key] = value;
            const previewArea = document.getElementById('certificate-capture-area');
            const titleArea = document.getElementById('view-cert-title');
            const recipientArea = document.getElementById('view-recipient');
            const imgContainer = document.getElementById('imageContainer');
            const colorTextEl = document.getElementById('frameColorText');

            if (previewArea) {
                previewArea.style.backgroundColor = customColors.bgColor;
                previewArea.style.borderColor = customColors.borderColor;
                previewArea.style.color = customColors.textColor;
            }
            if (titleArea) titleArea.style.color = customColors.textColor;
            if (recipientArea) recipientArea.style.color = customColors.textColor;
            if (imgContainer) imgContainer.style.borderColor = customColors.frameColor;
            if (colorTextEl && key === 'frameColor') colorTextEl.value = value;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageSrc = e.target.result;
                    const imgEl = document.getElementById('certCustomImage');
                    const containerEl = document.getElementById('imageContainer');
                    if (imgEl && containerEl) {
                        imgEl.src = uploadedImageSrc;
                        containerEl.style.display = 'block';
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function changeImageSize(size) {
            imageSize = size;
            const imgEl = document.getElementById('certCustomImage');
            if (imgEl) imgEl.style.width = `${size}px`;
        }

        function changeImageFrame(frameClass) {
            imageFrameClass = frameClass;
            const containerEl = document.getElementById('imageContainer');
            const imgEl = document.getElementById('certCustomImage');
            if (containerEl && imgEl) {
                containerEl.className = `draggable-image ${frameClass}`;
                if (frameClass === 'frame-circle') imgEl.className = 'rounded-full';
                else imgEl.className = '';
                imgEl.style.width = `${imageSize}px`;
                imgEl.style.height = 'auto';
            }
        }

        function setupDraggable() {
            const container = document.getElementById('imageContainer');
            const area = document.getElementById('certificate-capture-area');
            if (!container || !area) return;

            container.addEventListener('mousedown', dragStart);
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            container.addEventListener('touchstart', dragStart, { passive: false });
            window.addEventListener('touchmove', dragMove, { passive: false });
            window.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                startX = clientX - container.offsetLeft;
                startY = clientY - container.offsetTop;
            }

            function dragMove(e) {
                if (!isDragging) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let x = clientX - startX;
                let y = clientY - startY;

                x = Math.max(0, Math.min(x, area.clientWidth - container.clientWidth));
                y = Math.max(0, Math.min(y, area.clientHeight - container.clientHeight));

                container.style.left = `${x}px`;
                container.style.top = `${y}px`;
                initialLeft = x;
                initialTop = y;
            }

            function dragEnd() {
                isDragging = false;
            }
        }

        function switchView(view) {
            currentView = view;
            renderApp();
        }

        async function goToGallery() {
            showToast('⏳ جاري تحديث وجلب بيانات المعرض من السحابة...');
            await loadUserCertificates();
            switchView('gallery');
        }

        function updatePreview() {
            formData.introText = document.getElementById('introText').value;
            formData.recipientName = document.getElementById('recipientName').value;
            formData.message = document.getElementById('message').value;
            formData.senderName = document.getElementById('senderName').value;
            formData.fontFamily = document.getElementById('certificateFont').value;

            document.getElementById('view-intro').textContent = formData.introText;
            document.getElementById('view-recipient').textContent = formData.recipientName;
            document.getElementById('view-message').textContent = formData.message;
            document.getElementById('view-sender').textContent = formData.senderName;
            
            const previewArea = document.getElementById('certificate-capture-area');
            if (previewArea) previewArea.style.fontFamily = `'${formData.fontFamily}', sans-serif`;
        }

        // 1. دالة طلب الرمز السري (تتعرف تلقائياً على حالة الحساب)
        async function sendOtpCode() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) return showToast('⚠️ يرجى إدخال البريد الإلكتروني أولاً.');

            showToast('⏳ جاري طلب إرسال الرمز الرقمي الفوري...');

            // نقوم بطلب الرمز، وسيقوم Supabase بإرسال 6 أرقام للبريد الإلكتروني
            const { data, error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    shouldCreateUser: true // إذا لم يكن البريد مسجلاً، سيقوم بإنشاء حساب له تلقائياً!
                }
            });

            if (error) {
                showToast('❌ خطأ: ' + error.message);
            } else {
                targetEmail = email;
                isOtpSent = true;
                showToast('🔢 تم إرسال الرمز بنجاح! تفكدي بريدك الإلكتروني الآن.');
                renderApp();
            }
        }

        // 2. دالة التحقق الذكية من الرمز المكون من 6 خانات
        async function verifyOtpCode() {
            const token = document.getElementById('otp-code').value.trim();
            if (!token || token.length !== 6) return showToast('⚠️ يرجى إدخال الرمز المكون من 6 خانات.');

            showToast('⏳ جاري التحقق من الرمز سحابياً...');

            // نجرب أولاً التحقق بنوع magiclink (للمستخدمين المسجلين سابقاً)
            let result = await supabaseClient.auth.verifyOtp({
                email: targetEmail,
                token: token,
                type: 'magiclink'
            });

            // إذا فشل، نجرب نوع signup (في حال كان هذا أول دخول للبريد وإنشاء حساب جديد)
            if (result.error) {
                result = await supabaseClient.auth.verifyOtp({
                    email: targetEmail,
                    token: token,
                    type: 'signup'
                });
            }

            if (result.error) {
                showToast('❌ الرمز غير صحيح أو انتهت صلاحيته الزمنيّة.');
            } else if (result.data.user) {
                currentUser = result.data.user;
                isOtpSent = false;
                showToast('👋 تم التحقق المباشر! أهلاً بكِ في سحابتكِ الرقمية.');
                currentView = 'dashboard';
                await loadUserCertificates();
                renderApp();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            currentView = 'login';
            isOtpSent = false;
            targetEmail = '';
            showToast('👋 تم تسجيل الخروج وتأمين لوحة التحكم.');
            renderApp();
        }

        async function saveCertificateToSupabase() {
            if (!currentUser) return showToast('⚠️ سجل الدخول أولاً');
            
            const { error } = await supabaseClient.from('certificates').insert([
                {
                    user_id: currentUser.id,
                    recipient_name: formData.recipientName,
                    message: formData.message,
                    sender_name: formData.senderName,
                    certificate_type: formData.certificateType,
                    theme: customColors.bgColor, 
                    font_family: customColors.textColor 
                }
            ]);

            if (error) showToast('❌ فشل الحفظ: ' + error.message);
            else {
                showToast('💾 تم حفظ الشهادة بنجاح في المعرض السحابي!');
                await loadUserCertificates();
            }
        }

        async function loadUserCertificates() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('certificates')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (!error && data) currentRecords = data;
        }

        async function deleteCertificate(id) {
            const { error } = await supabaseClient.from('certificates').delete().eq('id', id);
            if (!error) {
                showToast('🗑️ تم الحذف السحابي بنجاح');
                await loadUserCertificates();
                renderApp();
            }
        }

        async function downloadCertificateAsPNG() {
            const area = document.getElementById('certificate-capture-area');
            if (!area) return;
            showToast('⏳ جاري معالجة الألوان وحفظ الصورة...');
            
            const canvas = await html2canvas(area, { 
                scale: 3, 
                useCORS: true,
                logging: false,
                letterRendering: false, 
                backgroundColor: null
            });
            
            const link = document.createElement('a');
            link.download = `${formData.recipientName}-شهادة_شكر.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('✅ تم تحميل شهادتكِ بجودة فائقة!');
        }

        window.addEventListener('DOMContentLoaded', () => { initApp(); });
  </script>
 </body>
</html>
